<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <meta name="google-site-verification" content="AZ-lnZ4HS5XY0TqEfI3rY4zKi1QZz6Dc11gfhs9IqjA" /> <!-- pragma: allowlist secret (token público de verificação Google) -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">
  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <script src="{{ site.baseurl }}/assets/js/moldura.js" data-menu="barra" data-rodape="leitura" data-pagina="{% if page.layout == 'post' %}artigos/{% else %}{{ page.url }}{% endif %}"{% if page.fontes %} data-fontes="{{ page.fontes | escape }}"{% endif %}></script>
  {% if page.folha %}<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/folha.css?v={{ site.time | date: '%s' }}">{% endif %}
  <style>
    :root {
      --green: var(--pv-verde);
      --dark: var(--pv-tinta);
      --light: var(--pv-papel);
      --text: var(--pv-tinta);
      --muted: var(--pv-suave);
      --accent: var(--pv-verde);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--pv-sans);
      color: var(--text);
      background: var(--light);
      line-height: 1.7;
    }
    main.wide { max-width: none; margin: 0; padding: 0; }
    main {
      max-width: 780px;
      margin: 2rem auto;
      padding: 0 1.2rem;
    }
    article h2 { margin-top: 2.5rem; }
    article h3 { margin-top: 2rem; }
    a { color: var(--accent); }
    img { max-width: 100%; border-radius: 4px; }
    code {
      background: #e8e8e0;
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.2rem 0;
    }
    pre code { background: none; padding: 0; color: inherit; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      font-size: 0.92rem;
    }
    thead th {
      background: var(--dark);
      color: white;
      font-weight: 600;
      padding: 0.6rem 0.8rem;
      text-align: left;
      letter-spacing: 0.2px;
    }
    thead th:last-child { text-align: right; }
    tbody td {
      padding: 0.45rem 0.8rem;
      border-bottom: 1px solid #e0e0d8;
    }
    tbody td:last-child { text-align: right; }
    tbody tr:nth-child(even) { background: #f5f5ef; }
    tbody tr:hover { background: #eef2e8; }
    tbody tr:last-child td { border-bottom: 2px solid var(--dark); }
    tbody tr:last-child { font-weight: 600; }
    @media (max-width: 768px) {
      main { margin: 1rem auto; padding: 0 0.8rem; }
    }
  </style>
</head>
<body{% if page.folha %} class="folha-pg"{% endif %}>
  <main{% if page.wide %} class="wide"{% endif %}>
    {{ content }}
  </main>
</body>
</html>
