<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">
  <link rel="icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
  <style>
    :root {
      --green: #2E7D32;
      --dark: #1a1a2e;
      --light: #fafaf7;
      --text: #2a2a2a;
      --muted: #777;
      --accent: #228B22;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--light);
      line-height: 1.7;
    }
    header {
      background: #fafaf7;
      padding: 1rem 1rem 0.4rem;
      text-align: center;
    }
    .site-logo {
      max-height: 160px;
      width: auto;
      max-width: 90%;
      display: block;
      margin: 0 auto;
      border-radius: 0;
    }
    header p {
      color: #888;
      margin-top: 0.2rem;
      font-size: 0.82rem;
    }
    nav {
      background: var(--dark);
      padding: 0.7rem 1rem 0.9rem;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      transition: all 0.15s;
    }
    nav a:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    main {
      max-width: 780px;
      margin: 2rem auto;
      padding: 0 1.2rem;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 3rem;
    }
    article h2 { margin-top: 2.5rem; }
    article h3 { margin-top: 2rem; }
    a { color: var(--accent); }
    img { max-width: 100%; border-radius: 4px; }
    code {
      background: #e8e8e0;
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.2rem 0;
    }
    pre code { background: none; padding: 0; color: inherit; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      font-size: 0.92rem;
    }
    thead th {
      background: var(--dark);
      color: white;
      font-weight: 600;
      padding: 0.6rem 0.8rem;
      text-align: left;
      letter-spacing: 0.2px;
    }
    thead th:last-child { text-align: right; }
    tbody td {
      padding: 0.45rem 0.8rem;
      border-bottom: 1px solid #e0e0d8;
    }
    tbody td:last-child { text-align: right; }
    tbody tr:nth-child(even) { background: #f5f5ef; }
    tbody tr:hover { background: #eef2e8; }
    tbody tr:last-child td { border-bottom: 2px solid var(--dark); }
    tbody tr:last-child { font-weight: 600; }
    @media (max-width: 768px) {
      header { padding: 0.7rem 0.8rem 0.3rem; }
      .site-logo { max-height: 100px; }
      nav { padding: 0.5rem 0.6rem 0.7rem; gap: 0.2rem; }
      nav a { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
      main { margin: 1rem auto; padding: 0 0.8rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/assets/images/logo-porto-verde.png" alt="Porto Verde" class="site-logo">
    </a>
    <p><em>Mapas interactivos de vegetação, uso do solo e mudanças urbanas no Porto</em></p>
  </header>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  <footer>
    {% unless page.url == "/" %}
    <img src="{{ site.baseurl }}/favicon.png" alt="" style="width:56px;height:56px;object-fit:contain;opacity:0.75;display:block;margin:0 auto 0.8rem;">
    {% endunless %}
    <a href="https://coolio1.github.io/" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);">Nuno Quental</a><br>
    Dados abertos: Sentinel-2, Landsat, OSM, PDM Porto
  </footer>
</body>
</html>
