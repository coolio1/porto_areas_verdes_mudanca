---
layout: default
---
<style>
  .post-title {
    font-size: 1.85rem;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 0.8rem;
    color: var(--text);
  }
  .post-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 1.8rem;
  }
  .post-tag {
    background: #e8f0e8;
    color: var(--green);
    padding: 0.15em 0.6em;
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 500;
  }
  .post-hero {
    display: block;
    width: 100%;
    max-height: 440px;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 8px;
    margin-bottom: 2rem;
  }
  article p { margin-bottom: 1.1rem; }
  article ul, article ol { margin: 0.5rem 0 1.1rem 1.6rem; }
  article li { margin-bottom: 0.4rem; }
  article img {
    display: block;
    width: 100%;
    border-radius: 6px;
    margin: 1.8rem 0 0.3rem;
  }
  /* caption: *italic* alone on line after image */
  article p:has(> img) + p > em:only-child {
    display: block;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    font-style: normal;
    margin-bottom: 1.6rem;
    margin-top: 0;
  }
  article h2 {
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 2.8rem;
    margin-bottom: 0.6rem;
    color: var(--text);
  }
  article h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-top: 2rem;
    margin-bottom: 0.4rem;
    color: var(--green);
  }
  article hr {
    border: none;
    border-top: 2px solid #e8e8e0;
    margin: 2.5rem 0;
  }
  article strong { color: var(--text); }
  .post-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #ddd;
    font-size: 0.9rem;
    color: var(--muted);
  }
  @media (max-width: 600px) {
    .post-title { font-size: 1.45rem; }
    .post-hero { max-height: 260px; }
  }
</style>

<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    <time>{{ page.date | date: "%d %B %Y" }}</time>
    {% if page.tags %}
      &middot;
      {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
    {% endif %}
  </div>
  {% if page.image %}
  <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title }}" class="post-hero">
  {% endif %}
  {{ content }}
  <div class="post-footer">
    <a href="{{ site.baseurl }}/">&larr; Voltar ao índice</a>
  </div>
</article>
