---
layout: default
---
<style>
  .post-title {
    font-size: 1.85rem;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 0.8rem;
    color: var(--text);
  }
  .post-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 1.8rem;
  }
  .post-tag {
    background: #e8f0e8;
    color: var(--green);
    padding: 0.15em 0.6em;
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 500;
  }
  .post-hero {
    display: block;
    width: 100%;
    max-height: 440px;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 8px;
    margin-bottom: 2rem;
  }
  article p { margin-bottom: 1.1rem; }
  article ul, article ol { margin: 0.5rem 0 1.1rem 1.6rem; }
  article li { margin-bottom: 0.4rem; }
  article img {
    display: block;
    width: 100%;
    border-radius: 6px;
    margin: 1.8rem 0 0.3rem;
  }
  /* caption: *italic* alone on line after image */
  article p:has(> img) + p > em:only-child {
    display: block;
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    font-style: normal;
    margin-bottom: 1.6rem;
    margin-top: 0;
  }
  article h2 {
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 2.8rem;
    margin-bottom: 0.6rem;
    color: var(--text);
  }
  article h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-top: 2rem;
    margin-bottom: 0.4rem;
    color: var(--green);
  }
  article hr {
    border: none;
    border-top: 2px solid #e8e8e0;
    margin: 2.5rem 0;
  }
  article strong { color: var(--text); }
  /* modo Leitura: serifa no texto e nos títulos; sans nos metadados, tabelas e rodapé do artigo */
  article { font-family: var(--pv-serif); font-size: 1.06rem; }
  .post-title, article h2, article h3 { font-family: var(--pv-serif); font-weight: 800; letter-spacing: -0.01em; }
  .post-meta, .post-tag, .post-footer, article table, article figcaption { font-family: var(--pv-sans); }
  .post-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #ddd;
    font-size: 0.9rem;
    color: var(--muted);
  }
  @media (max-width: 600px) {
    .post-title { font-size: 1.45rem; }
    .post-hero { max-height: 260px; }
  }
  /* tabelas de texto: sem a linha final a negrito nem a última coluna à direita (regras globais pensadas para totais numéricos) */
  article table.tabela-texto tbody tr:last-child { font-weight: 400; }
  article table.tabela-texto thead th:last-child, article table.tabela-texto tbody td:last-child { text-align: left; }
  /* artigos com identidade da nota PDF (article_class: nota) */
  article.nota h2 {
    font-family: var(--pv-serif);
    font-size: 1.55rem;
    line-height: 1.2;
    color: #1B4D20;
    border-top: 3px solid #D9642B;
    padding-top: 0.7rem;
    margin-top: 3rem;
  }
  article.nota h3 { font-family: var(--pv-serif); color: var(--pv-verde); }
  article.nota blockquote {
    background: #f1f6ee;
    border-left: 4px solid #2E7D32;
    border-radius: 0 6px 6px 0;
    margin: 0 0 1.6rem;
    padding: 0.7rem 1rem;
    font-size: 0.88rem;
    color: #2b322c;
  }
  article.nota blockquote p { margin: 0; }
  article.nota p > strong:first-child { color: #1B4D20; }
  article.nota img { box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  article.nota .cx img { box-shadow: none; }
</style>

<article{% if page.article_class %} class="{{ page.article_class }}"{% endif %}>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    <time>{% include data-pt.html d=page.date %}</time>
    {% if page.tags %}
      &middot;
      {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
    {% endif %}
  </div>
  {% if page.image %}
  <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title }}" class="post-hero">
  {% endif %}
  {{ content }}
  <div class="post-footer">
    <a href="{{ site.baseurl }}/">&larr; Voltar ao índice</a>
  </div>
</article>
