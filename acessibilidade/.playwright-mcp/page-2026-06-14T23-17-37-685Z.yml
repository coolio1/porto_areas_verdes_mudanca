        - emphasis [ref=e254]: et al.
        - text: (2025); EEA (2022); dados municipais.
      - heading "5.3. Três lições da comparação" [level=3] [ref=e255]
      - paragraph [ref=e256]:
        - strong [ref=e257]: 1. O “efeito Monsanto” é universal.
        - text: "Porto, Lisboa, Barcelona, Paris e Viena partilham o mesmo padrão: um ou dois grandes parques periféricos (Parque da Cidade, Monsanto, Collserola, Bois de Boulogne/Vincennes, Wienerwald) que inflacionam os indicadores agregados enquanto os bairros densos do centro ficam com valores próximos de zero. As cidades do Sul da Europa são particularmente afectadas pela combinação de centros históricos compactos com malha verde residual. O Porto encaixa-se neste padrão mediterrânico de défice estrutural."
      - paragraph [ref=e258]:
        - strong [ref=e259]: 2. Ter muito verde não garante equidade.
        - text: "Viena ilustra isto de forma extrema: com 55–95 m²/hab no agregado, é uma das cidades mais verdes da Europa — mas os distritos centrais de Josefstadt e Neubau ficam abaixo de 1,5 m²/hab, valores comparáveis aos piores do centro do Porto. Londres, com 47% da sua área classificada como verde, ainda tem 750 mil pessoas com menos de 0,44 m²/hab (CPRE London). A lição é clara: a quantidade total de verde não substitui a acessibilidade local."
      - paragraph [ref=e260]:
        - strong [ref=e261]: 3. O standard de 9 m²/hab precisa de ser repensado.
        - text: O limiar de 9 m²/hab, frequentemente atribuído à OMS, tem na realidade origem provável no Decreto Ministerial italiano de 1968 (Przewoźna
        - emphasis [ref=e262]: et al.
        - text: ", 2024). A OMS recomenda oficialmente que todos os residentes tenham acesso a"
        - strong [ref=e263]: ≥0,5 ha de verde a <300 m de casa
        - text: "(OMS, 2016) — um critério de proximidade, não de área per capita. A regra 3-30-300 de Konijnendijk (2023) vai mais longe: 3 árvores visíveis de cada casa, 30% de cobertura de copa por bairro, 300 m até ao verde mais próximo. Na AMP, Quental (2010) mediu uma distância média ponderada de 1 110 m ao espaço verde mais próximo — quase quatro vezes o limiar da OMS. Copenhaga e Amesterdão adoptaram standards ainda mais exigentes (15 min a pé e 60 m²/hab a 500 m, respectivamente), demonstrando que é possível estabelecer metas ambiciosas."
      - separator [ref=e264]
      - heading "6. Discussão" [level=2] [ref=e265]
      - heading "Concordância com a literatura" [level=3] [ref=e266]
      - paragraph [ref=e267]:
        - text: "A forte heterogeneidade revelada pelo 2SFCA confirma três décadas de alertas sobre a desigualdade verde no Porto: desde o diagnóstico de indicadores de sustentabilidade do Grande Porto (Quental & Macedo, 2006), passando pelas desigualdades socioeconómicas documentadas por Hoffimann"
        - emphasis [ref=e268]: et al.
        - text: (2017), até à vulnerabilidade térmica de Lopes
        - emphasis [ref=e269]: et al.
        - text: (2025). As zonas de maior risco térmico coincidem com as de menor acessibilidade a verde — um reforço mútuo entre ausência de verde e calor urbano. Quental (2010) demonstrou que a distância ao espaço verde mais próximo na AMP diminuiu de 1 403 m (1991) para 1 110 m (2006), reflectindo investimentos em parques, mas que a variável
        - code [ref=e270]: green space distance
        - text: não se revelou estatisticamente significativa na modelação da mobilidade — sugerindo que a mera proximidade a verde, sem massa crítica de área, pode não ser suficiente para alterar comportamentos. Esta observação sublinha a importância de avaliar a acessibilidade efectiva (área por habitante, como no 2SFCA) e não apenas a distância ao parque mais próximo.
      - heading "Limitações" [level=3] [ref=e271]
      - paragraph [ref=e272]: O raio de 500 m é euclidiano; a distância real pela rede viária é superior, especialmente nas encostas do Porto. Os dados de população (GHS-POP 2020) podem não reflectir alterações recentes do alojamento local. O método trata todos os m² de verde como equivalentes — a incorporação de qualidade (arvoredo, equipamento, como proposto por Rigolon, 2016) enriqueceria a análise. Podem existir pequenos espaços verdes de acesso livre não contemplados no inventário.
      - heading "Implicações" [level=3] [ref=e273]
      - paragraph [ref=e274]:
        - text: A estratégia municipal deveria priorizar o
        - strong [ref=e275]: eixo central e oriental
        - text: "— onde o défice ponderado pela população é mais severo. Intervenções possíveis: abertura de logradouros ao uso público, conversão de terrenos expectantes em jardins de bolso ("
        - emphasis [ref=e276]: pocket parks
        - text: "), arborização intensiva de praças. O contraste entre 1 678 ha de verde privado e 202 ha de verde usufruível levanta a questão da permeabilização: incentivos à abertura parcial de logradouros, servidões de passagem, cedências verdes em operações urbanísticas — mecanismos que Quental (2010) já propunha como instrumento de reequilíbrio territorial no Porto."
      - separator [ref=e277]
      - heading "7. Conclusões" [level=2] [ref=e278]
      - paragraph [ref=e279]:
        - strong [ref=e280]: 81,7% da população do Porto
        - text: vive com acessibilidade a verde público inferior a 9 m²/hab num raio de 500 m.
        - strong [ref=e281]: 56,0%
        - text: encontra-se em défice crítico (<3 m²/hab), concentrado no centro e leste — as zonas mais densas e termicamente vulneráveis. Apenas 18,3% tem acesso adequado. Aplicando o critério de proximidade de Konijnendijk (2023),
        - strong [ref=e282]: 44,2% da população
        - text: não tem um parque de ≥0,4 ha a ≤300 m de casa.
      - paragraph [ref=e283]: "Dos 448 ha classificados como verde público pelo PDM, apenas ~217 ha são efectivamente usufruíveis. A métrica agregada per capita é insuficiente para avaliar a equidade — e o Porto não é caso único: Lisboa, Barcelona e Paris partilham o mesmo padrão de défice estrutural em núcleos densos."
