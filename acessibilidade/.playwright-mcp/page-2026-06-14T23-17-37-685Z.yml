  - main [ref=e16]:
    - article [ref=e17]:
      - 'heading "Acessibilidade a Espaços Verdes Públicos no Porto: Uma Análise Espacial pelo Método 2SFCA" [level=1] [ref=e18]'
      - paragraph [ref=e19]: 30 March 2026 · porto acessibilidade verde público 2sfca gee ghs-pop osm sentinel-2
      - paragraph [ref=e20]:
        - strong [ref=e21]: "Acessibilidade a Espaços Verdes Públicos no Porto: Uma Análise Espacial pelo Método Two-Step Floating Catchment Area"
      - separator [ref=e22]
      - heading "1. Introdução" [level=2] [ref=e23]
      - paragraph [ref=e24]: "O Porto dispõe de 19,3 m² de espaço verde público por habitante — acima do limiar de 9 m²/hab frequentemente atribuído à OMS. Porém, esta métrica agregada esconde uma realidade desigual: quem vive junto ao Parque da Cidade tem uma dotação generosa; quem habita na Sé, em Campanhã ou no interior de Paranhos pode não ter nenhum espaço verde acessível a pé."
      - paragraph [ref=e25]:
        - text: Este trabalho aplica o método
        - emphasis [ref=e26]: Two-Step Floating Catchment Area
        - text: (2SFCA) ao município do Porto, cruzando um inventário de 79 parques e jardins de acesso público gratuito, a classificação de uso do solo por Sentinel-2, e a grelha de população GHS-POP. O resultado é um mapa da acessibilidade efectiva a verde público em m² por habitante num raio pedonal de 500 m.
      - separator [ref=e27]
      - heading "2. Enquadramento" [level=2] [ref=e28]
      - 'heading "2.1. Verde público no Porto: a ilusão do agregado" [level=3] [ref=e29]'
      - paragraph [ref=e30]: A tensão entre indicadores agregados favoráveis e realidades locais deficitárias é um tema recorrente na literatura sobre o Porto. Quental (2010), na sua tese sobre modelação de estrutura urbana sustentável na Área Metropolitana do Porto, já identificava a distribuição espacial assimétrica da infraestrutura verde como um dos principais desafios da sustentabilidade urbana na região. A análise GIS de Quental para as 130 freguesias da AMP revelou que a distância média ponderada pela população ao espaço verde mais próximo era de 1 110 m em 2006 (contra 1 403 m em 1991) — uma melhoria ao longo do tempo, mas ainda muito acima do limiar de 300 m recomendado pela OMS — e que “algumas áreas densas de Vila Nova de Gaia, Gondomar e Matosinhos estão bastante mal equipadas” em termos de verde acessível (Quental, 2010, p. 262). Quental & Macedo (2006), no diagnóstico de indicadores de desenvolvimento sustentável para o Grande Porto, quantificaram esta assimetria e alertaram para a insuficiência das métricas per capita como instrumento de planeamento.
      - paragraph [ref=e31]:
        - text: Graça
        - emphasis [ref=e32]: et al.
        - text: (2018) mapearam 95 espaços verdes no Porto (~424 ha). A presente análise identifica
        - strong [ref=e33]: 448 ha de verde público classificado
        - text: pelo PDM 2021 — valor coerente. Contudo, desta área, apenas ~202 ha correspondem a parques e jardins de acesso efectivamente livre. Hoffimann
        - emphasis [ref=e34]: et al.
        - text: (2017), usando análise de rede viária e o
        - emphasis [ref=e35]: Public Open Space Tool
        - text: ", demonstraram que o acesso a verde no Porto varia com o estatuto socioeconómico: 90% da população nos bairros menos desfavorecidos vive a ≤800 m de um espaço verde, contra 75,8% nos mais desfavorecidos. Saraiva"
        - emphasis [ref=e36]: et al.
        - text: (2025) confirmaram estas desigualdades com análise de correspondência múltipla aplicada a 89 espaços verdes públicos.
      - heading "2.2. Equidade e vulnerabilidade térmica" [level=3] [ref=e37]
      - paragraph [ref=e38]:
        - text: Wolch
        - emphasis [ref=e39]: et al.
        - text: (2014) sintetizaram a evidência de que populações de menor rendimento tendem a residir em bairros com menor acesso a verde — o
        - emphasis [ref=e40]: green gentrification paradox
        - text: . No Porto, Lopes
        - emphasis [ref=e41]: et al.
        - text: (2025) demonstraram que 32,6% do território se encontra em zonas de elevado risco térmico, precisamente nas áreas de maior densidade e menor cobertura vegetal. Os modelos de Quental (2010) para a AMP — que classificaram a estrutura territorial de 130 freguesias em domínios de sustentabilidade usando redes neuronais, equações estruturais e regressão múltipla — já mostravam que a forma urbana compacta favorece padrões de mobilidade e consumo mais sustentáveis, mas que o rendimento e a dimensão das famílias são os factores que mais influenciam os padrões ambientais à escala da freguesia. Este resultado reforça a necessidade de intervir directamente na infraestrutura verde das zonas densas, onde a forma urbana por si só não compensa o défice.
      - heading "2.3. O método 2SFCA" [level=3] [ref=e42]
      - paragraph [ref=e43]: "As métricas tradicionais — área per capita por freguesia, buffers de proximidade, NDVI médio — apresentam limitações conhecidas: diluem a informação em médias administrativas, não distinguem dimensão dos espaços, ou confundem verde público com privado."
      - paragraph [ref=e44]:
        - text: O método
        - emphasis [ref=e45]: Two-Step Floating Catchment Area
        - text: "(Luo & Wang, 2003) supera estas limitações ao considerar simultaneamente a oferta (área verde) e a procura (população) num raio definido. Para cada espaço verde, calcula-se o rácio área/população servida; para cada ponto de população, somam-se os rácios dos espaços acessíveis. O resultado captura o efeito de saturação: um parque pequeno rodeado por muita gente vale menos, por pessoa, do que um parque grande com pouca população. Dai (2011) aplicou-o a Atlanta, Rigolon (2016) evidenciou o papel da qualidade dos parques, e Luo & Qi (2009) propuseram a variante com decaimento gaussiano — embora para raios pedonais curtos (≤500 m) a diferença prática seja marginal (Langford"
        - emphasis [ref=e46]: et al.
        - text: ", 2008)."
      - separator [ref=e47]
