      - heading "3.2. Inventário de parques" [level=3] [ref=e83]
      - paragraph [ref=e84]:
        - text: Compilou-se uma lista de
        - strong [ref=e85]: 79 parques e jardins de acesso público e gratuito
        - text: ", partindo do directório oficial da CMP (20 espaços) e complementando com espaços omitidos mas de acesso comprovadamente livre: praças, largos, jardins de bairro, parques infantis e alamedas identificados via OpenStreetMap, PDM e levantamento de campo. Contornos obtidos preferencialmente via polígonos PDM (categoria “fruição colectiva”) e OpenStreetMap (Overpass API / API v0.6). Área total:"
        - strong [ref=e86]: ~217 hectares
        - text: .
      - paragraph [ref=e87]:
        - text: A classificação Sentinel-2 seguiu a metodologia multi-sazonal descrita em Quental (2026), com 90,4% de concordância com o ESA WorldCover 2021 para a classe arbórea. Esta classificação é utilizada para a
        - strong [ref=e88]: camada visual
        - text: do mapa, mas o cálculo de acessibilidade usa a área total dos polígonos.
      - paragraph [ref=e89]:
        - text: Os polígonos do PDM que
        - strong [ref=e90]: não correspondem
        - text: a nenhum dos 79 parques (jardins de escolas, hortas com acesso restrito, separadores viários) são apresentados como “Verde pago ou não usufruível”.
      - heading "3.3. Cálculo do 2SFCA" [level=3] [ref=e91]
      - paragraph [ref=e92]: "Implementação em versão raster contínua no Google Earth Engine:"
      - list [ref=e93]:
        - listitem [ref=e94]: Máscara binária dos 79 parques × área do pixel (57 m²)
        - listitem [ref=e95]: Soma focal do verde num kernel circular de raio 500 m (76×58 pixels)
        - listitem [ref=e96]: "Soma focal da população (GHS-POP, corrigida para reamostragem: factor ~1/175)"
        - listitem [ref=e97]: "Filtro: exclui pixels com <50 hab no raio de 500 m"
        - listitem [ref=e98]: Acessibilidade = verde_500m / pop_500m (m²/hab)
      - paragraph [ref=e99]: O raio de 500 m é um compromisso entre o limiar europeu de 300 m (OMS, 2016) e a topografia acidentada do Porto.
