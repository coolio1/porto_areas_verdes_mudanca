      - 'heading "4.4. Proximidade 300m: o critério de Konijnendijk" [level=3] [ref=e145]'
      - paragraph [ref=e146]: "A regra 3-30-300 (Konijnendijk, 2023) propõe que todos os residentes devem ter acesso a um espaço verde a ≤300 m de casa. Embora a formulação original refira parques de ≥1 ha, adoptamos aqui o limiar de ≥0,4 ha — por melhor reflectir a escala dos espaços verdes urbanos do Porto, onde muitos jardins e praças com funções recreativas relevantes ficam abaixo de 1 ha. Aplicando este critério aos 61 parques do inventário com área ≥0,4 ha:"
