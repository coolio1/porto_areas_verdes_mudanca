      - 'heading "4.5. Verde privado: o paradoxo de equidade" [level=3] [ref=e164]'
      - paragraph [ref=e165]: Os 1 678 ha de verde privado (quarteirões, logradouros, moradias) prestam serviços ecossistémicos locais — mas não são acessíveis ao público. As zonas com mais verde privado são as mesmas que já dispõem de mais verde público, enquanto as zonas densas carecem de ambos.
      - separator [ref=e166]
      - heading "5. O Porto no Contexto Europeu e Internacional" [level=2] [ref=e167]
      - paragraph [ref=e168]: "O défice de acessibilidade a verde no Porto não é um caso isolado — mas a comparação com outras cidades exige cautela, porque os valores de m²/hab variam enormemente conforme a definição adoptada: verde público acessível, verde público total (incluindo parques periféricos), ou verde total (incluindo florestas urbanas). A tabela seguinte compara o Porto com Lisboa e oito cidades internacionais, distinguindo os valores “com tudo” dos valores “efectivos”."
      - 'heading "5.1. Lisboa: o mesmo problema com números diferentes" [level=3] [ref=e169]'
      - paragraph [ref=e170]:
        - text: Lisboa é o caso comparativo mais directo. A cidade reporta ~37 m²/hab de verde público — mas este valor inclui o Parque Florestal de Monsanto (~900 ha), que sozinho representa cerca de metade do verde total. Sem Monsanto, a dotação cai para ~7–10 m²/hab, comparável ao Porto sem o Parque da Cidade. Catarino
        - emphasis [ref=e171]: et al.
        - text: (2025), num estudo de 26 capitais europeias, calcularam para Lisboa um
        - emphasis [ref=e172]: Urban Green Equity Index
        - text: "de 0,387 — abaixo da média europeia — com desigualdades intra-urbanas marcadas: bairros como o Parque das Nações dispõem de verde abundante, enquanto Marvila e Beato apresentam défices severos. O projecto GREEN SURGE (2015) já documentara esta fragmentação. O diagnóstico é estruturalmente o mesmo que no Porto: um ou dois grandes parques periféricos mascaram a escassez no tecido urbano denso."
