<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<title>Mapa — Porto Verde</title>
<meta name="description" content="Mapa interactivo do espaço verde do Porto: acessibilidade e propostas, mudanças 2016-2025, histórico desde 1947 e verde privado.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Mapa único — gramática «Carta» (maquete V2b aprovada): folha de filete 1px de tinta, sem sombras nem
   cantos redondos, etiquetas mono, IBM Plex. Só modo claro (escuro = fase 2: redefinir estes tokens sob
   prefers-color-scheme e :root[data-theme="dark"], como na V2b). */
:root{
  --papel:#FAFAF7;--tinta:#10212C;--suave:#4B6270;--filete:#10212C;--fino:#C9D3D0;--painel:#FAFAF7;--realce:#EEF2EF;--marca:#0B5232;
  /* placa do mapa (fundo «Carta») */
  --map-papel:#E6EDEB;--map-agua:#A9CADB;--map-fora:#F3F4F0;--map-grade:rgba(16,33,44,.10);--map-rot-agua:#2F5A70;--map-halo:#E6EDEB;
  /* cor-guia de cada tema (cromo, AA sobre o papel) */
  --g-acessibilidade:#0B5232;--g-regra:#2E5C94;--g-hoje:#B42F2F;--g-historico:#7A4E22;--g-privado:#7C6526;--g-casos:#6A3FB5;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--serif:'IBM Plex Serif',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body.mu{background:var(--papel);color:var(--tinta);font-family:var(--sans);hyphens:none;-webkit-hyphens:none;overflow:hidden;
  height:100dvh;display:grid;grid-template-columns:384px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"cab mapa" "painel mapa" "rod rod"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.mu :focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

/* ===== cabeçalho: a barra do site (moldura.js, data-menu="barra") arrumada na coluna do painel ===== */
body.mu .pv-barra{grid-area:cab;display:block;height:auto;padding:0;gap:0;position:static;background:var(--painel);
  border-right:1px solid var(--filete);border-bottom:1px solid var(--filete);font-family:var(--sans)}
body.mu .pv-barra__marca{padding:14px 20px 12px;gap:10px;text-decoration:none}
body.mu .pv-barra__mini{width:38px;height:38px;border-radius:50%}
body.mu .pv-barra__nome{width:160px}
body.mu .pv-barra__links{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--filete)}
body.mu .pv-barra__links a{display:block;padding:7px 10px;font-size:13px;font-weight:500;border-right:1px solid var(--filete);
  border-bottom:1px solid var(--filete)}
body.mu .pv-barra__links a:nth-child(3n){border-right:0}
body.mu .pv-barra__links a:nth-child(n+4){border-bottom:0}
body.mu .pv-barra__links a:hover{background:var(--realce);text-decoration:none}
body.mu .pv-barra__links a.active{background:var(--tinta);color:var(--painel)}
body.mu .pv-barra__links a:focus-visible{outline-offset:-3px}
body.mu .pv-barra__menu{display:none}

/* ===== rodapé (moldura.js): faixa de filete a toda a largura ===== */
body.mu .pv-rodape--mapa{grid-area:rod;position:static;inset:auto;max-width:none;display:block;padding:7px 20px;border:0;
  border-top:1px solid var(--filete);background:var(--painel);font:400 11.5px var(--mono);color:var(--suave)}
body.mu .pv-rodape__logo{display:none}
body.mu .pv-rodape p{display:flex;justify-content:space-between;gap:16px}
body.mu .pv-rodape p br{display:none}
body.mu .pv-rodape__nome{font:700 12.5px var(--sans);color:var(--tinta)}

/* ===== painel ===== */
#panel{grid-area:painel;border-right:1px solid var(--filete);background:var(--painel);display:flex;flex-direction:column;min-height:0}
.temas{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.alca{display:none}

/* separadores fixos dos temas (sempre à vista) + corpo do tema aberto com scroll próprio */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--filete);flex:none}
.tab{--guia:var(--g-acessibilidade);all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  padding:9px 2px 8px;border-top:3px solid transparent;font:500 12.5px/1.1 var(--sans);color:var(--suave);text-align:center;min-width:0}
.tab+.tab{border-left:1px solid var(--fino)}
.tab[data-t="regra"]{--guia:var(--g-regra)}.tab[data-t="hoje"]{--guia:var(--g-hoje)}.tab[data-t="historico"]{--guia:var(--g-historico)}.tab[data-t="privado"]{--guia:var(--g-privado)}.tab[data-t="casos"]{--guia:var(--g-casos)}
.tab svg{width:20px;height:20px;color:var(--guia);display:block}
.tab:hover{background:var(--realce)}
.tab.on{border-top-color:var(--guia);color:var(--tinta);font-weight:700;background:var(--painel)}
.tab:focus-visible{outline:2px solid var(--tinta);outline-offset:-4px}
@media (max-width:360px){.tab{font-size:11.5px;letter-spacing:-.01em}}   /* 6 separadores: «Mudanças» cortava a 320 px */
.tema{--guia:var(--g-acessibilidade);display:none}
.tema[data-t="regra"]{--guia:var(--g-regra)}.tema[data-t="hoje"]{--guia:var(--g-hoje)}.tema[data-t="historico"]{--guia:var(--g-historico)}.tema[data-t="privado"]{--guia:var(--g-privado)}.tema[data-t="casos"]{--guia:var(--g-casos)}
.tema.on{display:block}
.tema-tit{margin:0;padding:14px 20px 4px 24px;font:700 21px/1.2 var(--sans);letter-spacing:-.015em}
.corpo{padding:0 20px 18px 24px}
.desc{font:400 14px/1.55 var(--serif);margin:2px 0 14px;max-width:46ch}
.tema-sub{font:400 12px var(--mono);color:var(--suave)}

/* números-chave: um grande, dois de apoio, régua de cor-guia */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 4px;border-top:1px solid var(--guia);padding-top:12px}
.num{margin:0;min-width:0}
.num b{display:block;font:700 22px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num b small{font:500 12px var(--mono);letter-spacing:0;margin-left:3px;color:var(--suave)}
.num p{margin:4px 0 0;font-size:12.5px;line-height:1.35;color:var(--suave)}
.num.mor{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.num.mor b{font-size:52px;letter-spacing:-.035em;color:var(--tinta)}
.num.mor b small{font-size:15px}
.num.mor p{margin:0 0 4px;font-size:13px;color:var(--tinta)}

/* segmentado (vista) e botões de filete */
.seg{display:flex;border:1px solid var(--filete);margin:14px 0 4px}
.seg button{all:unset;flex:1;text-align:center;cursor:pointer;font:500 13px/1 var(--sans);padding:9px 6px;color:var(--tinta)}
.seg button+button{border-left:1px solid var(--filete)}
.seg button.active,.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--painel)}
.seg button:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;cursor:pointer;border:1px solid var(--filete);
  font:500 13px/1 var(--sans);padding:9px 6px;margin:8px 0 0;color:var(--tinta)}
.btn:hover{background:var(--realce)}
.btn.active{background:var(--tinta);color:var(--painel)}
.cab2{display:flex;justify-content:space-between;gap:8px;font:400 11px/1 var(--mono);color:var(--suave);margin:18px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--fino)}

/* camadas: amostra de cor = interruptor; barra de ha na cor da camada; opacidade quando ligada */
.cam{--sw:var(--tinta);display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0}
.cam input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1px solid var(--tinta);cursor:pointer;background:transparent;border-radius:0}
.cam input[type=checkbox]:checked{background:var(--sw);box-shadow:inset 0 0 0 2px var(--painel)}
.cam input[type=checkbox].contorno:checked{background:transparent;box-shadow:inset 0 0 0 2px var(--painel),inset 0 0 0 4px var(--sw)}
.cam input[type=checkbox]:disabled{opacity:.35;cursor:not-allowed}
.cam label{font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .ha{font:500 12px var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.cam .med{grid-column:2/3;height:8px;position:relative;background:repeating-linear-gradient(90deg,var(--fino) 0 1px,transparent 1px 25%)}
.cam .med i{position:absolute;left:0;top:0;bottom:0;background:var(--sw);min-width:2px}
.cam.off{color:var(--suave)}
.cam.off .med i{opacity:.3}
.cam .op{grid-column:2/-1;display:none;align-items:center}
.cam.opa:not(.off) .op{display:flex}
.cam .op input{width:100%}
.opb{all:unset;cursor:pointer;width:22px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--suave)}
.opb svg{width:14px;height:14px;display:block}
.opb:hover,.opb[aria-expanded="true"]{color:var(--tinta);background:var(--realce)}
.opb:focus-visible{outline:2px solid var(--tinta);outline-offset:1px}
.cam.off .opb{visibility:hidden}
.cam.sub{margin-left:28px}
.catleg{grid-column:2/-1;display:grid;gap:4px;margin:2px 0 2px;font:400 12px/1.3 var(--sans);color:var(--tinta)}
.cam.off .catleg{display:none}
.catleg span{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.catleg i{display:block;width:22px;height:12px}
.catleg i.trac{outline:1.5px dashed var(--tinta);outline-offset:-1.5px;opacity:.85}
.catleg .n{font:500 11.5px var(--mono);color:var(--suave)}
#panel input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;margin:0;cursor:pointer}
#panel input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--suave)}
#panel input[type=range]::-moz-range-track{height:1px;background:var(--suave)}
#panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:12px;background:var(--tinta);margin-top:-6px;border-radius:0}
#panel input[type=range]::-moz-range-thumb{width:8px;height:12px;background:var(--tinta);border:0;border-radius:0}
#panel select{font:400 13px var(--sans);border:1px solid var(--filete);background:var(--painel);color:var(--tinta);padding:6px 8px;border-radius:0;width:100%;height:34px}
.fonte{font:400 11px/1.5 var(--mono);color:var(--suave);margin:16px 0 0}
.fonte a{color:inherit}
.pop-leg{display:flex;align-items:center;gap:6px;margin:0 0 4px 28px;font:400 10.5px var(--mono);color:var(--suave)}
.pop-leg i{width:110px;height:8px;background:linear-gradient(to right,#f5e6d0,#d4b896,#b08a5e,#8b6934,#6b4a1e,#4a2f0a)}

/* Histórico: escada das épocas (cada época com a sua cor; a escada é o seletor) */
.escada{display:grid;gap:2px;margin:4px 0 0}
.escada button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:6px 84px 1fr 54px;gap:8px;align-items:center;cursor:pointer;
  padding:5px 6px 5px 0;min-height:30px;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--tinta)}
.escada button:hover{background:var(--realce)}
.escada button::before{content:"";align-self:stretch;background:var(--ep);opacity:0}
.escada .b{height:12px;background:repeating-linear-gradient(90deg,var(--fino) 0 1px,transparent 1px 10%)}
.escada .b i{display:block;height:100%;background:var(--ep);opacity:.8}
.escada button.active{background:var(--realce);font-weight:600}
.escada button.active::before{opacity:1}
.escada button.active .b i{opacity:1}
.escada button:focus-visible{outline:2px solid var(--tinta);outline-offset:1px}
.escada small{display:block;font-size:10px;font-weight:400;color:var(--suave)}
.h-fonte{font:400 11.5px/1.45 var(--mono);color:var(--suave);margin:8px 0 0}
.h-fonte b{color:var(--tinta);font-weight:500}
.h-comp label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--suave);margin:6px 0}
.leg{display:grid;gap:4px;margin:6px 0 2px;font:400 12px/1.3 var(--sans)}
.leg>div{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.leg i{display:block;width:22px;height:12px}
#h-cortina{position:absolute;top:0;bottom:0;width:0;z-index:801;pointer-events:none}
.h-linha{position:absolute;top:0;bottom:0;left:-1px;width:3px;background:var(--tinta);pointer-events:auto;cursor:ew-resize;touch-action:none}
.h-asa{position:absolute;top:50%;left:-18px;width:36px;height:36px;margin-top:-18px;background:var(--painel);border:1px solid var(--filete);color:var(--tinta);
  font:500 18px/34px var(--mono);text-align:center;cursor:ew-resize;touch-action:none;pointer-events:auto;user-select:none}
.h-etq{position:absolute;top:16px;background:var(--painel);border:1px solid var(--filete);color:var(--tinta);font:500 11.5px var(--mono);padding:4px 8px;white-space:nowrap}
.h-etq-e{right:10px}.h-etq-d{left:10px}
.h-asa:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

/* ===== mapa ===== */
#map{grid-area:mapa;position:relative;min-width:0;min-height:0;font-family:var(--sans)}
#map.leaflet-container{background:var(--map-fora)}
#map.fundo-carta{background:repeating-linear-gradient(-45deg,var(--map-grade) 0 1px,transparent 1px 7px),var(--map-fora)}
.mu-carta-canvas{position:absolute;inset:0;z-index:650;pointer-events:none}
.leaflet-zoom-anim .mu-carta-canvas{opacity:0}
.cx{position:absolute;z-index:1000;background:var(--painel);border:1px solid var(--filete)}
.zoom{right:16px;top:16px;display:flex;flex-direction:column}
.zoom button{all:unset;cursor:pointer;width:34px;height:34px;text-align:center;font:500 17px/34px var(--mono);color:var(--tinta)}
.zoom button:hover{background:var(--realce)}
.zoom button+button{border-top:1px solid var(--filete)}
.zoom button:focus-visible{outline:2px solid var(--tinta);outline-offset:-3px}
.pe{left:16px;bottom:16px;display:flex;align-items:stretch;font:400 11.5px var(--mono);color:var(--tinta)}
.pe>span{padding:6px 10px;display:flex;align-items:center;gap:8px}
.pe>span+span{border-left:1px solid var(--filete)}
.pe .bar{display:block;height:6px;border:1px solid var(--tinta);border-top:0;background:linear-gradient(90deg,var(--tinta) 0 50%,transparent 50%) bottom/100% 2px no-repeat}
.pe .norte svg{width:14px;height:20px;display:block;color:var(--tinta)}
.pe .xy{min-width:19ch}
.ficha{left:16px;top:16px;width:300px;padding:14px 16px;display:none;border-top:4px solid var(--fc,var(--marca))}
.ficha.on{display:block;z-index:1001}
.ficha h3{font:700 19px/1.15 var(--sans);margin:0 26px 3px 0;letter-spacing:-.01em}
.ficha .sub{font-size:12.5px;color:var(--suave);margin:0 0 10px}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:12.5px}
.ficha dt{color:var(--suave)}.ficha dd{margin:0;font:500 12px var(--mono);text-align:right}
.ficha .cmp{margin-top:12px;font:400 11px var(--mono);color:var(--suave)}
.ficha .cmp .med{height:8px;margin-top:4px;border:1px solid var(--filete)}
.ficha .cmp .med i{display:block;height:100%;background:var(--marca)}
.ficha .x{all:unset;position:absolute;right:8px;top:8px;width:26px;height:26px;text-align:center;line-height:26px;cursor:pointer;font-size:18px}
.ficha .x:focus-visible{outline:2px solid var(--tinta)}
/* tema Casos: corpo da ficha (rola dentro da ficha), fotos antes/depois, referências */
.ficha .fcorpo{margin-top:12px;max-height:calc(100vh - 300px);overflow-y:auto;font-size:13px;line-height:1.5}
.ficha .fcorpo p{margin:0 0 8px}
.ficha .fotos{display:grid;gap:6px;margin-bottom:10px}.ficha .fotos.n2{grid-template-columns:1fr 1fr}
.ficha .fotos figure{margin:0}.ficha .fotos img{display:block;width:100%;height:96px;object-fit:cover;border:1px solid var(--fino)}
.ficha .fotos.n1 img{height:140px}
.ficha figcaption{font:400 10.5px/1.3 var(--mono);color:var(--suave);margin-top:2px}
.ficha .cont{font-size:12.5px}.ficha .nota-ed{font-size:12.5px;border-left:3px solid var(--g-casos);padding-left:8px}
.ficha .refs{margin:0 0 8px;padding-left:18px;font-size:12px}.ficha .refs span{font-family:var(--mono);color:var(--suave)}
.ficha .ver-caso{display:inline-block;font:500 12.5px var(--sans);margin-top:2px}
/* tema Casos: marcadores, cartão de hover, filtros */
.caso-mk{background:none;border:0}.caso-mk svg{display:block}
.caso-mk:focus-visible{outline:2px solid var(--tinta);outline-offset:1px}
.leaflet-tooltip.caso-hover{width:210px;padding:0;white-space:normal;border:1px solid var(--filete);border-radius:0;box-shadow:none;background:var(--painel);color:var(--tinta)}
.leaflet-tooltip.caso-hover:before{display:none}
.caso-hover img{display:block;width:100%;height:104px;object-fit:cover;border-bottom:1px solid var(--filete)}
.caso-hover .t{font:700 13px/1.25 var(--sans);padding:8px 10px 2px}
.caso-hover .s{font:400 11.5px var(--mono);color:var(--suave);padding:0 10px 8px}
.casos-filtros label{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.casos-filtros .sw{display:inline-flex;width:18px;justify-content:center}.casos-filtros em{margin-left:auto;font:400 11.5px var(--mono);color:var(--suave);font-style:normal}
/* números-chave sobre o mapa (core.js: MU.moverNums) */
.nums-card{left:16px;bottom:62px;width:292px;padding:14px 34px 12px 16px;display:none;max-height:calc(100% - 150px);overflow:auto}
.nums-card.on{display:block}
.nums-card .x{all:unset;position:absolute;right:6px;top:5px;width:26px;height:26px;text-align:center;line-height:26px;cursor:pointer;font-size:18px;color:var(--tinta)}
.nums-card .x:hover{background:var(--realce)}
.nums-card .x:focus-visible,.nums-chip:focus-visible{outline:2px solid var(--tinta);outline-offset:-3px}
.nums-card .nums-tema{display:none}.nums-card .nums-tema.on{display:block}
.nums-card .nums{margin:0}
.nums-artigo{display:block;margin-top:10px;padding-top:8px;border-top:1px solid var(--fino);font:500 12px/1.35 var(--mono);color:var(--marca);text-decoration:underline;text-underline-offset:2px}
.nums-artigo[hidden]{display:none}
.nums-artigo:hover{color:var(--tinta)}
.nums-artigo:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.nums-card .num.mor{gap:10px}
.nums-card .num.mor b{font-size:36px}
.nums-chip{left:16px;bottom:62px;display:none;padding:6px 10px;font:500 11.5px var(--mono);color:var(--tinta);cursor:pointer}
.nums-chip.on{display:block}
.nums-chip:hover{background:var(--realce)}
.topo-ctl{position:absolute;z-index:1000;right:60px;top:16px;display:flex;gap:8px}
.ir{font:400 13px var(--sans);border:1px solid var(--filete);background:var(--painel);color:var(--tinta);padding:6px 8px;border-radius:0;height:36px;max-width:230px;min-width:0}
.ir.fundo{max-width:190px}
/* Leaflet à maneira da carta: sem sombras nem cantos redondos */
#map .leaflet-popup-content-wrapper{border-radius:0;box-shadow:none;border:1px solid var(--filete);background:var(--painel);color:var(--tinta)}
#map .leaflet-popup-tip{box-shadow:none;border:1px solid var(--filete);background:var(--painel)}
#map .leaflet-popup-content{font:400 12.5px/1.4 var(--sans);margin:10px 14px}
#map .leaflet-control-attribution{background:rgba(250,250,247,.85);font:400 10px var(--mono);color:var(--suave)}
#map .leaflet-control-attribution a{color:inherit}
.cand-label{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;font:600 11px var(--sans);color:#00563F;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.cand-label::before{display:none}

@media (max-width:760px){
  body.mu{grid-template-columns:minmax(0,1fr);grid-template-areas:"cab" "mapa" "rod";position:relative}
  body.mu .pv-barra{border-right:0}
  body.mu .pv-barra__marca{padding:8px 16px 6px}
  body.mu .pv-barra__mini{width:28px;height:28px}
  body.mu .pv-barra__nome{width:112px}
  body.mu .pv-barra__links{display:flex;overflow-x:auto;scrollbar-width:none}
  body.mu .pv-barra__links a{flex:none;border-bottom:0!important;border-right:1px solid var(--filete)!important}
  #panel{position:absolute;left:0;right:0;bottom:var(--rodh,52px);z-index:1100;border-right:0;border-top:1px solid var(--filete);
    max-height:var(--espia,200px);overflow:hidden;transition:max-height .25s ease}
  #panel.aberto{max-height:calc(100% - var(--rodh,52px) - 40px)}
  #panel:not(.aberto) .temas{overflow:hidden}
  .alca{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 16px 6px;cursor:pointer;font:500 12px var(--mono);color:var(--suave);
    text-align:center;border-bottom:1px solid var(--fino)}
  .alca::before{content:"";display:block;width:36px;height:3px;background:var(--tinta);margin:0 auto 6px}
  .alca:focus-visible{outline:2px solid var(--tinta);outline-offset:-3px}
  .tab{padding:7px 2px 6px}
  .tema-tit{font-size:18px;padding:10px 16px 2px 20px}
  .corpo{padding:0 16px 14px 20px}
  .num.mor b{font-size:40px}
  .nums-card{left:12px;right:12px;bottom:56px;width:auto;max-height:calc(100% - 70px)}
  .nums-chip{left:12px;bottom:12px}
  .nums-card .num.mor b{font-size:30px}
  #map{margin-bottom:var(--espia,200px)}
  #panel:not(.aberto) .desc{display:none}
  .ficha{left:12px;right:12px;width:auto;top:12px}
  .topo-ctl{left:12px;right:auto;top:12px;flex-direction:column;gap:6px}
  .ir,.ir.fundo{max-width:170px}
  .ficha.on~.topo-ctl{display:none}
  .pe{left:auto;right:12px;bottom:12px}
  .pe .xy{display:none}
  .zoom{right:12px;top:12px}
  .ficha.on~.zoom{display:none}
  body.mu .pv-rodape--mapa{padding:8px 16px 10px;position:relative;z-index:1200}
  body.mu .pv-rodape p{display:block}
  body.mu .pv-rodape__nome{display:block}
}
@media (min-width:761px) and (max-height:820px){
  body.mu .pv-barra__marca{padding:8px 20px 6px}
  body.mu .pv-barra__mini{width:30px;height:30px}
  body.mu .pv-barra__nome{width:128px}
  body.mu .pv-barra__links a{padding:5px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body class="mu">
<script src="../assets/js/moldura.js" data-pagina="mapa_unico/mapa_unico.html" data-menu="barra"></script>
<aside id="panel" aria-label="Temas, camadas e legenda">
  <button type="button" class="alca" id="alca" aria-expanded="false">Mostrar camadas e números</button>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tipo de mapa"></div>
  <div class="temas" id="temas"></div>
  <div id="ctx-bloco">
    <div class="cab2"><span>Contexto</span><span></span></div>
    <div id="ctx-rows"></div>
    <div id="pop-legend" class="pop-leg" style="display:none;">
      <span>0</span><i></i><span>150+ hab/píxel de 100 m</span>
    </div>
    <p class="fonte" id="fonte"></p>
  </div>
</aside>
<main id="map" aria-label="Mapa do Porto">
  <div class="cx ficha" id="ficha" role="region" aria-label="Ficha" aria-live="polite"></div>
  <div class="cx nums-card" id="nums-card" role="region" aria-label="Números-chave"><button type="button" class="x" id="nums-x" aria-label="Fechar os números-chave">×</button><div id="nums-corpo"></div><a class="nums-artigo" id="nums-artigo" target="_blank" rel="noopener" hidden>Ler o artigo &rarr;</a></div>
  <button type="button" class="cx nums-chip" id="nums-chip" aria-label="Mostrar os números-chave">Números</button>
  <div class="topo-ctl" id="topo-ctl"><select class="ir" id="ir" aria-label="Ir para um parque"></select><select class="ir fundo" id="fundo-select" aria-label="Fundo do mapa"></select></div>
  <div class="cx zoom" id="zoom"><button type="button" data-z="1" aria-label="Aproximar">+</button><button type="button" data-z="-1" aria-label="Afastar">−</button><button type="button" data-z="0" aria-label="Ver o concelho inteiro">⌂</button></div>
  <div class="cx pe" id="pe"><span class="norte" title="Norte"><svg viewBox="0 0 14 20" aria-hidden="true"><path d="M7 1 12 15 7 12 2 15Z" fill="currentColor"/><path d="M7 1 7 12 2 15Z" fill="var(--painel)" stroke="currentColor" stroke-width=".8"/></svg><span class="sr">Norte para cima</span></span><span><span><span class="bar"></span><span class="esc-t"></span></span></span><span class="xy" aria-hidden="true">—</span></div>
</main>
<script>
/* Núcleo do mapa único do Porto Verde. Tudo vive em window.MU (sem globais soltas):
   cada tema regista-se com MU.registarTema() e só é montado quando é aberto.
   Gramática «Carta» (maquete V2b): separadores fixos dos temas com cor-guia, números-chave, camadas com amostra
   que é o interruptor e barra de hectares, fundo do mapa sobre o mapa, ficha do parque, moldura de carta
   (quadrícula, esquadria, área fora do estudo tracejada) e fundo «Carta» sem mosaicos. */
(function () {
  var BOUNDS = [[41.13, -8.7], [41.19, -8.54]];
  var B = { S: 41.13, N: 41.19, W: -8.7, E: -8.54 };
  var MU = window.MU = { TEMAS: {}, ORDEM: [], DADOS: {}, BOUNDS: BOUNDS, tema: null };
  var TINTA = '#10212C', PARQUE = '#0B5232', PARQUE_ORLA = '#06301D';

  /* ---------- utilitários partilhados ---------- */
  MU.hexToRgb = function (h) {
    h = h.replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  };
  MU.n = function (x, d) { return Number(x).toLocaleString('pt-PT', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };
  MU.ha = function (x) { return MU.n(x, x < 100 ? 1 : 0) + ' ha'; };

  MU.extractMask = function (src) {
    return new Promise(function (resolve) {
      var i = new Image();
      i.onload = function () {
        var c = document.createElement('canvas');
        c.width = i.width; c.height = i.height;
        var x = c.getContext('2d');
        x.drawImage(i, 0, 0);
        var d = x.getImageData(0, 0, c.width, c.height);
        var a = new Uint8Array(d.data.length / 4);
        for (var j = 0; j < a.length; j++) a[j] = d.data[j * 4 + 3];
        resolve({ w: c.width, h: c.height, alpha: a });
      };
      i.src = src;
    });
  };

  /* op (0-1) multiplica o alpha; por omissão 1 = alpha original */
  MU.renderColored = function (m, hex, op) {
    op = (op === undefined) ? 1 : op;
    var rgb = MU.hexToRgb(hex);
    var c = document.createElement('canvas');
    c.width = m.w; c.height = m.h;
    var x = c.getContext('2d');
    var d = x.createImageData(m.w, m.h);
    for (var i = 0; i < m.alpha.length; i++) {
      d.data[i * 4] = rgb[0]; d.data[i * 4 + 1] = rgb[1];
      d.data[i * 4 + 2] = rgb[2]; d.data[i * 4 + 3] = m.alpha[i] * op;
    }
    x.putImageData(d, 0, 0);
    return c.toDataURL();
  };

  /* Camada de máscara recolorível: {overlay, setColor(hex), cor}. bounds por omissão = BOUNDS. */
  MU.camadaMascara = async function (o) {
    var m = await MU.extractMask(o.src);
    var cam = { mask: m, cor: o.color, overlay: null };
    var opc = {}; if (o.pane) opc.pane = o.pane; if (o.op != null) opc.opacity = o.op;
    cam.overlay = L.imageOverlay(MU.renderColored(m, o.color), o.bounds || BOUNDS, opc);
    cam.setColor = function (hex) { cam.cor = hex; cam.overlay.setUrl(MU.renderColored(m, hex)); };
    return cam;
  };

  /* ---------- peças do painel ---------- */
  MU.cab2 = function (esq, dir) { return '<div class="cab2"><span>' + esq + '</span><span>' + (dir || '') + '</span></div>'; };
  /* números-chave: [{v, u, r}] — o primeiro é o grande */
  MU.htmlNums = function (N) {
    return '<div class="num mor"><b>' + N[0].v + '<small>' + N[0].u + '</small></b><p>' + N[0].r + '</p></div>' +
      N.slice(1).map(function (n) { return '<div class="num"><b>' + n.v + '<small>' + n.u + '</small></b><p>' + n.r + '</p></div>'; }).join('');
  };
  /* escala comum das barras de hectares de um tema: 400, 1000 ou 3000 ha */
  MU.escala = function (has) {
    var max = Math.max.apply(null, has.concat([1]));
    return max > 1500 ? 3000 : max > 600 ? 1000 : 400;
  };

  /* Linha de camada: amostra = interruptor (--sw), rótulo, hectares + barra, legenda de categorias, opacidade.
     o: {label, checked, color, contorno, ha, esc, leg:[[cor, texto, tracejado?]], nota, sub, id,
         onToggle(on), opacidade:{v, min, max, step, id, onInput(v)}} */
  var nLinha = 0;
  MU.linha = function (container, o) {
    var id = o.id || ('mu-l' + (++nLinha));
    var row = document.createElement('div');
    row.className = 'cam' + (o.checked ? '' : ' off') + (o.sub ? ' sub' : '');
    if (o.color) row.style.setProperty('--sw', o.color);
    var h = '<input type="checkbox" id="' + id + '"' + (o.checked ? ' checked' : '') + (o.contorno ? ' class="contorno"' : '') + '>' +
      '<label for="' + id + '">' + o.label + '</label><span class="ha">' + (o.ha ? MU.ha(o.ha) : '') + '</span>' +
      (o.opacidade ? '<button type="button" class="opb" aria-expanded="false" aria-label="Opacidade: ' + o.label.replace(/<[^>]+>/g, '') + '" title="Opacidade">' +
        '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>' : '');
    if (o.ha && o.esc && o.ha <= o.esc) h += '<div class="med" aria-hidden="true"><i style="width:' + Math.min(100, o.ha / o.esc * 100).toFixed(2) + '%"></i></div>';
    if (o.leg) {
      h += '<div class="catleg">' + o.leg.map(function (l) {
        return '<span><i' + (l[2] ? ' class="trac"' : '') + ' style="background:' + l[0] + '"></i>' + l[1] + '</span>';
      }).join('') + (o.nota ? '<span><i></i>' + o.nota + '</span>' : '') + '</div>';
    }
    if (o.opacidade) {
      var p = o.opacidade;
      h += '<div class="op"><input type="range"' + (p.id ? ' id="' + p.id + '"' : '') + ' min="' + (p.min || 0.1) + '" max="' + (p.max || 1) +
        '" step="' + (p.step || 0.05) + '" value="' + p.v + '" aria-label="Opacidade: ' + o.label.replace(/<[^>]+>/g, '') + '"></div>';
    }
    row.innerHTML = h;
    container.appendChild(row);
    var cb = row.querySelector('input[type=checkbox]');
    cb.addEventListener('change', function () {
      row.classList.toggle('off', !cb.checked);
      if (o.onToggle) o.onToggle(cb.checked);
    });
    var opb = row.querySelector('.opb');
    if (opb) opb.addEventListener('click', function () { var a = row.classList.toggle('opa'); opb.setAttribute('aria-expanded', a); });
    var op = row.querySelector('.op input');
    if (op) op.addEventListener('input', function () { o.opacidade.onInput(+op.value); });
    return { row: row, cb: cb, op: op };
  };

  /* Cria camadas de máscara + linhas do painel para defs [{id,label,color,show,op,ha}] (dados em
     MU.DADOS[tema.dados][id]) e guarda-as em tema._camadas, para activar/desactivar em bloco. */
  /* Pane com nível fixo: a ordem das camadas no mapa não depende da ordem em que se ligam.
     Regra: topo da lista do painel = topo do mapa (z maior); cada def indica o seu z (< 540, o dos parques). */
  MU.pane = function (nome, z) {
    if (!MU.map.getPane(nome)) MU.map.createPane(nome);
    MU.map.getPane(nome).style.zIndex = z;
    return nome;
  };
  MU.addCamadas = async function (tema, box, defs, esc) {
    tema._camadas = tema._camadas || [];
    for (var i = 0; i < defs.length; i++) {
      var c = defs[i];
      var cam = await MU.camadaMascara({ src: MU.DADOS[tema.dados][c.id], color: c.color, op: c.op, pane: c.z ? MU.pane('mu-' + tema.id + '-' + c.id, c.z) : undefined });
      var l = { cam: cam, linha: null };
      l.linha = MU.linha(box, {
        label: c.label, checked: c.show !== false, color: c.color, ha: c.ha, esc: esc,
        onToggle: (function (l) {
          return function (on) {
            if (MU.tema !== tema.id) return;
            on ? l.cam.overlay.addTo(MU.map) : MU.map.removeLayer(l.cam.overlay);
          };
        })(l),
        opacidade: { v: c.op == null ? 1 : c.op, onInput: (function (l) { return function (v) { l.cam.overlay.setOpacity(v); }; })(l) }
      });
      tema._camadas.push(l);
    }
  };
  MU.activarCamadas = function (tema) {
    (tema._camadas || []).forEach(function (l) { if (l.linha.cb.checked) l.cam.overlay.addTo(MU.map); });
  };
  MU.desactivarCamadas = function (tema) {
    (tema._camadas || []).forEach(function (l) { MU.map.removeLayer(l.cam.overlay); });
  };

  MU.carregarDados = function (nome) {
    MU._dadosP = MU._dadosP || {};
    if (!MU._dadosP[nome]) {
      MU._dadosP[nome] = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'dados/' + nome + '.js';
        s.onload = function () { resolve(MU.DADOS[nome]); };
        s.onerror = function () { reject(new Error('Falha ao carregar dados/' + nome + '.js')); };
        document.head.appendChild(s);
      });
    }
    return MU._dadosP[nome];
  };

  /* ---------- ficha (parque ou candidato), no canto do mapa ---------- */
  MU.ficha = function (f) {
    var box = document.getElementById('ficha');
    if (MU._sel) { MU._sel.grupo.resetStyle(MU._sel.layer); MU._sel = null; }
    if (!f) { box.classList.remove('on'); box.innerHTML = ''; return; }
    if (f.layer && f.grupo) { MU._sel = { layer: f.layer, grupo: f.grupo }; f.layer.setStyle({ color: TINTA, weight: 2.6 }); }
    box.style.setProperty('--fc', f.cor || PARQUE);
    box.innerHTML = '<button type="button" class="x" aria-label="Fechar a ficha">×</button><h3>' + f.titulo + '</h3><p class="sub">' + f.sub + '</p><dl>' +
      f.linhas.map(function (l) { return '<dt>' + l[0] + '</dt><dd>' + l[1] + '</dd>'; }).join('') + '</dl>' +
      (f.rel != null ? '<div class="cmp">Área face ao Parque da Cidade (' + MU.n(MU._maiorParque, 2) + ' ha)<div class="med"><i style="width:' +
        Math.max(1, f.rel * 100).toFixed(1) + '%"></i></div></div>' : '') +
      (f.corpo ? '<div class="fcorpo">' + f.corpo + '</div>' : '');   // corpo: HTML já escapado por quem chama (tema Casos)
    box.classList.add('on');
    box.querySelector('.x').onclick = function () { MU.ficha(null); };
  };

  /* ---------- parques e jardins: camada comum (cheia ou só contorno), ficha, «Ir para um parque» ---------- */
  var TIPO_P = { jardim: 'Jardim', parque: 'Parque', 'praça': 'Praça', quinta: 'Quinta' };
  MU._parques = {};
  MU.fichaParque = function (i, layer, grupo) {
    var P = MU.PARQUES[i], g = P.f.properties, S = MU.DADOS.contexto.stats, c = P.centro;
    MU.ficha({
      titulo: g.nome, cor: PARQUE, layer: layer, grupo: grupo,
      sub: (TIPO_P[g.tipo] || g.tipo || '') + ' · polígono ' + (g.fonte === 'osm' ? 'OpenStreetMap' : 'CMP'),
      linhas: [['Área', MU.n(g.area_calc_ha || 0, 2) + ' ha'],
               ['Dos parques do concelho', MU.n((g.area_calc_ha || 0) / S.parques_ha * 100, 1) + ' %'],
               ['Centro', MU.n(c.lat, 4) + ' N, ' + MU.n(Math.abs(c.lng), 4) + ' O']],
      rel: (g.area_calc_ha || 0) / MU._maiorParque
    });
  };
  MU.parques = function (estilo) {   // 'cheio' | 'contorno'
    if (MU._parques[estilo]) return MU._parques[estilo];
    var cont = estilo === 'contorno';
    var g = L.geoJson(MU.DADOS.contexto.parques, {
      pane: 'parquesPane',
      style: function () {
        return cont ? { color: PARQUE, weight: 1.6, opacity: 1, fillColor: PARQUE, fillOpacity: 0 }
                    : { color: PARQUE_ORLA, weight: 0.9, opacity: 1, fillColor: PARQUE, fillOpacity: 1 };
      },
      onEachFeature: function (f, layer) {
        layer.on('click', function (e) {
          L.DomEvent.stopPropagation(e);
          MU.fichaParque(MU.DADOS.contexto.parques.features.indexOf(f), layer, g);
        });
      }
    });
    g.on('add remove', function () { MU.desenharCarta(); });
    return (MU._parques[estilo] = g);
  };
  MU.parquesVisiveis = function () {
    return Object.keys(MU._parques).some(function (k) { return MU.map.hasLayer(MU._parques[k]); });
  };
  /* linha «Parques e jardins» de um tema; tema.linhaParques serve ao «Ir para um parque» */
  MU.linhaParques = function (tema, box, o) {
    var camada = MU.parques(o.contorno ? 'contorno' : 'cheio');
    tema._parquesCamada = camada;
    tema.linhaParques = MU.linha(box, {
      label: o.label || 'Parques e jardins', checked: o.on, color: PARQUE, contorno: o.contorno,
      ha: o.ha === false ? null : MU.DADOS.contexto.stats.parques_ha, esc: o.esc,
      onToggle: function (on) {
        if (MU.tema !== tema.id) return;
        on ? camada.addTo(MU.map) : MU.map.removeLayer(camada);
      },
      opacidade: { v: 1, onInput: function (v) { camada.setStyle(o.contorno ? { opacity: v } : { fillOpacity: v }); } }
    });
    return tema.linhaParques;
  };
  MU.activarParques = function (tema) { if (tema.linhaParques && tema.linhaParques.cb.checked) tema._parquesCamada.addTo(MU.map); };
  MU.desactivarParques = function (tema) { if (tema._parquesCamada) MU.map.removeLayer(tema._parquesCamada); };

  /* ---------- fundos de mapa (lista única; temas podem acrescentar o seu) ---------- */
  var ATTR = '&copy; OpenStreetMap';
  MU.FUNDOS = [
    { id: 'carta', nome: 'Carta (sem mosaicos)', criar: function () { return MU.ctx.carta(); } },
    { id: 'positron', nome: 'CartoDB Positron', url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_4uwz_1_ae45539b82f652a6fa47db0a' },
    { id: 'dark', nome: 'CartoDB Dark', url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_4uwz_1_ae45539b82f652a6fa47db0a' },
    { id: 'osm', nome: 'OpenStreetMap', url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4uwz_1_ae45539b82f652a6fa47db0a' },
    { id: 'satelite', nome: 'Satélite', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' }
  ];
  MU.fundoActual = null;
  MU.setFundo = function (id) {
    var f = MU.FUNDOS.filter(function (x) { return x.id === id; })[0];
    if (!f) return;
    if (MU.baseTile) MU.map.removeLayer(MU.baseTile);
    MU.baseTile = f.criar ? f.criar() : L.tileLayer(f.url, { maxZoom: 19, attribution: ATTR });
    MU.baseTile.addTo(MU.map);
    if (MU.baseTile.bringToBack) MU.baseTile.bringToBack();
    MU.fundoActual = id;
    MU.map.getContainer().classList.toggle('fundo-carta', id === 'carta');
    document.getElementById('fundo-select').value = id;
    MU.desenharCarta();
  };

  /* ---------- Contexto comum (limites, densidade) e peças do fundo «Carta» ---------- */
  MU.ctx = { itens: {}, estado: {} };   // estado[temaId] = {limites:{on}, densidade:{on}}
  var CTX_DEF = { limites: { on: true }, densidade: { on: false } };

  async function montarContexto() {
    var d = await MU.carregarDados('contexto');
    var map = MU.map;
    var lim = await MU.camadaMascara({ src: d.municipios, color: TINTA, pane: 'limitesPane', op: 0.9 });
    var dens = L.imageOverlay(d.ghspop, BOUNDS, { opacity: 0.7, pane: 'bgPane' });
    MU.ctx.itens = { limites: lim, densidade: dens };
    /* fundo «Carta»: placa de papel, água (Landsat, layers_historico/rio.png) e véu sobre os concelhos vizinhos */
    var agua = await MU.extractMask(d.agua), fora = await MU.extractMask(d.fora);
    var placa = L.rectangle(BOUNDS, { pane: 'placaPane', stroke: false, fillColor: '#E6EDEB', fillOpacity: 1, interactive: false });
    var ovAgua = L.imageOverlay(MU.renderColored(agua, '#A9CADB'), BOUNDS, { pane: 'cartaPane' });
    var veu = L.imageOverlay(MU.renderColored(fora, '#E6EDEB'), BOUNDS, { pane: 'veuPane', opacity: 0.58 });
    MU.ctx.carta = function () { return L.featureGroup([placa, ovAgua, veu]); };
    var box = document.getElementById('ctx-rows');

      d.innerHTML = '<h2 class="tema-tit">' + t.rotulo + '</h2><div class="corpo" id="tema-' + id + '"></div>';
      temas.appendChild(d);
    });
    var sel = document.getElementById('fundo-select');
    MU.FUNDOS.forEach(function (f) {
      var o = document.createElement('option'); o.value = f.id; o.textContent = f.nome; sel.appendChild(o);
    });
    sel.addEventListener('change', function () { MU.fundoManual = true; MU.setFundo(this.value); });
    window.addEventListener('hashchange', function () {
      var id = temaDoHash();
      if (id === MU.tema) { var t = MU.TEMAS[id]; if (t.aoHash) t.aoHash(); }  // só mudou um parâmetro
      else MU.abrirTema(id);
    });
    /* controlos do mapa (fora do arrasto do Leaflet) */
    ['ficha', 'topo-ctl', 'zoom', 'pe'].forEach(function (k) {
      var e = document.getElementById(k); L.DomEvent.disableClickPropagation(e); L.DomEvent.disableScrollPropagation(e);
    });
    document.querySelectorAll('#zoom button').forEach(function (b) {
      b.onclick = function () { var z = +b.dataset.z; if (z > 0) map.zoomIn(); else if (z < 0) map.zoomOut(); else MU.verConcelho(); };
    });
    map.on('mousemove', function (e) { document.querySelector('#pe .xy').textContent = MU.n(e.latlng.lat, 4) + '° N  ' + MU.n(Math.abs(e.latlng.lng), 4) + '° O'; });
    map.on('mouseout', function () { document.querySelector('#pe .xy').textContent = '—'; });
    map.on('click', function () { MU.ficha(null); });
    map.on('zoomend moveend resize', escala);
    map.on('move zoomend resize', MU.desenharCarta);
    CV = L.DomUtil.create('canvas', 'mu-carta-canvas', map.getPane('rotPane'));
    if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); MU.desenharCarta(); }).observe(map.getContainer());
    /* painel em folha deslizante no telemóvel */
    var pn = document.getElementById('panel'), alca = document.getElementById('alca');
    alca.addEventListener('click', function () {
      var on = !pn.classList.contains('aberto'); pn.classList.toggle('aberto', on);
      alca.setAttribute('aria-expanded', on); alca.textContent = on ? 'Esconder o painel' : 'Mostrar camadas e números';
    });
    var rodape = function () {
      var r = document.querySelector('.pv-rodape');
      if (r && window.ResizeObserver) new ResizeObserver(function () { document.documentElement.style.setProperty('--rodh', r.offsetHeight + 'px'); }).observe(r);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rodape); else rodape();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(MU.desenharCarta);
    await montarContexto();
    escala();
    MU.abrirTema(temaDoHash());
  };
})();

/* Tema «Acessibilidade e propostas» (antes acessibilidade/acessibilidade_verde.html e
   acessibilidade/conversao_verde.html). Duas vistas do mesmo mapa:
   «actual» = situação actual; «propostas» = simulação com os 46 candidatos a conversão. */
(function () {
  /* paleta das categorias (maquete V2b); as imagens chegam já recoloridas de mapa_unico.py (RECOLOR_ACC) */
  var CAT = { crit: '#A23B86', insuf: '#E6A6CC', adeq: '#3E6AB3', baixa: '#C8C8C8' };
  var TIPO = {
    'Estrategia de expansao (CMP)': { cor: '#00A884', rot: 'Estratégia de expansão (CMP)' },
    'Verde em PDM / fechado ao publico': { cor: '#D9642B', rot: 'Verde em PDM fechado ao público' },
    'Verde privado': { cor: '#D6C496', rot: 'Verde privado' }
  };
  var orla = function (hex) {   // contorno tracejado: a própria cor escurecida para a tinta
    var a = MU.hexToRgb(hex), b = MU.hexToRgb('#10212C');
    return '#' + a.map(function (v, i) { return ('0' + Math.round(v + (b[i] - v) * 0.4).toString(16)).slice(-2); }).join('');
  };

  MU.registarTema({
    id: 'acessibilidade',
    rotulo: 'Acessibilidade e propostas',
  artigo: { url: 'https://portoverde.pt/posts/acessibilidade-verde-publico-porto/' },
    fundo: 'carta',
    dados: 'acessibilidade',
    ctx: { limites: { on: true }, densidade: { on: false } },
    fonte: 'Sentinel-2 10 m (ESA) &middot; GHS-POP 100 m (JRC) &middot; 78 parques e jardins (CMP, OSM) &middot; ' +
           'm&eacute;todo Two-Step Floating Catchment Area (2SFCA). Hectares por contagem de p&iacute;xeis (&asymp; 57 m&sup2; cada) dentro do concelho.',

    vista: 'actual',       // 'actual' | 'propostas'
    ind: null,             // 'acc' | 'prox' | null
    _ov: {},               // cache de overlays: _ov[chave]
    _nomesCand: true,

    async montar(painel) {
      var self = this, D = MU.DADOS.acessibilidade, C = MU.DADOS.contexto, S = C.stats, map = MU.map;
      map.createPane('accPane'); map.getPane('accPane').style.zIndex = 450;
      map.createPane('lowPopPane'); map.getPane('lowPopPane').style.zIndex = 475;
      map.createPane('accMonoPane'); map.getPane('accMonoPane').style.zIndex = 480;
      map.createPane('candGeoPane'); map.getPane('candGeoPane').style.zIndex = 550;

      var P = D.meta;
      this._num = {
        actual: { prox: P.pct_actual, acc: P.sfca_actual_pct },
        propostas: { prox: P.pct_simulado, acc: P.sfca_sim_pct }
      };
      var esc = MU.escala([S.parques_ha, S.pago, S.privado]);

      painel.innerHTML =
        '<p class="desc">Popula&ccedil;&atilde;o a &le; 300&nbsp;m de um parque e verde p&uacute;blico por habitante. As propostas juntam 46 espa&ccedil;os candidatos.</p>' +
        '<div class="nums" id="ac-nums"></div>' +
        '<div class="seg" id="ac-vista" role="group" aria-label="Vista">' +
          '<button type="button" data-v="actual">Situa&ccedil;&atilde;o actual</button>' +
          '<button type="button" data-v="propostas">Com 46 propostas</button></div>' +
        '<div id="ac-intro" class="tema-sub" style="display:none;margin:6px 0 0;">Simula&ccedil;&atilde;o sequencial para atingir 80% de cobertura a &le; 300 m (Konijnendijk 3-30-300).</div>' +
        MU.cab2('Camadas', 'barras: 0&ndash;' + MU.n(esc) + ' ha') + '<div id="ac-camadas"></div>';

      var box = painel.querySelector('#ac-camadas');

      // topo da lista = topo do mapa: Candidatos (550) > Parques (540) > verdes (480) > indicadores (450-475)
      // --- Candidatos a conversão (GeoJSON tracejado; clicar abre a ficha; nomes a partir do zoom 14) ---
      this._cand = L.geoJson(D.candidatos, {
        pane: 'candGeoPane',
        filter: function (f) { return !/^Parques e Jardins j/.test(f.properties.tipo); },
        style: function (f) {
          var c = (TIPO[f.properties.tipo] || {}).cor || '#888888';
          return { color: orla(c), weight: 1.6, opacity: 1, dashArray: '5 3', fillColor: c, fillOpacity: 0.6 };
        },
        onEachFeature: function (f, layer) {
          var p = f.properties, t = TIPO[p.tipo] || { rot: p.tipo, cor: '#888888' };
          layer.on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            MU.ficha({
              titulo: p.nome || 'Candidato sem nome', sub: 'Candidato n.&ordm; ' + p.rank + ' &middot; ' + t.rot, cor: t.cor,
              layer: layer, grupo: self._cand,
              linhas: [['&Aacute;rea', MU.n(p.area_ha, 2) + ' ha']].concat(p.pop_delta != null ? [
                ['Habitantes que passam a ter parque a &le; 300 m', '+' + MU.n(p.pop_delta)],
                ['Cobertura do concelho', MU.n(p.pct_antes, 1) + ' % &rarr; ' + MU.n(p.pct_depois, 1) + ' %']] : [])
            });
          });
          layer.bindTooltip('#' + p.rank + (p.nome ? ' — ' + p.nome : ''),
            { permanent: true, direction: 'center', className: 'cand-label', offset: [0, 0] });
          if (p.label_lat && p.label_lon) {
            layer.on('tooltipopen', function () { layer.getTooltip().setLatLng([p.label_lat, p.label_lon]); });
          }
        }
      });
      this._lCand = MU.linha(box, {
        label: 'Candidatos a convers&atilde;o (46)', checked: false,
        color: 'linear-gradient(90deg,' + TIPO['Estrategia de expansao (CMP)'].cor + ' 0 33%,#D9642B 33% 66%,#D6C496 66%)',
        leg: Object.keys(TIPO).map(function (k) { return [TIPO[k].cor, TIPO[k].rot, true]; }),
        onToggle: function (on) { self._toggle(self._cand, on); },
        opacidade: { v: 0.6, onInput: function (v) { self._cand.setStyle({ fillOpacity: v }); } }
      });
      this._lNomes = MU.linha(box, {
        label: 'Nomes dos candidatos', checked: true, sub: true,
        onToggle: function (on) { self._nomesCand = on; self._rotulos(); }
      });

      // --- Parques e jardins (camada comum; clicar abre a ficha) ---
      this._lParques = MU.linhaParques(this, box, { on: true, esc: esc });

      // --- verde pago e verde privado (todas as áreas): pré-coloridos em Python, cores fixas das camadas ---
      this._mono = [];
      [[C.pago, 'Verde pago ou n&atilde;o usufru&iacute;vel', '#D9642B', S.pago],
       [D.imgs.privado, 'Verde privado', '#D6C496', S.privado]].forEach(function (d) {
        var ov = L.imageOverlay(d[0], MU.BOUNDS, { pane: 'accMonoPane' });
        var l = MU.linha(box, {
          label: d[1], checked: true, color: d[2], ha: d[3], esc: esc,
          onToggle: function (on) { self._toggle(ov, on); },
          opacidade: { v: 1, onInput: function (v) { ov.setOpacity(v); } }
        });
        self._mono.push({ ov: ov, linha: l });
      });

      // --- indicadores (um de cada vez): verde público a 500 m por habitante, parque a 300 m ---
      this._opInd = 0.75;
      var opInd = { v: 0.75, onInput: function (v) { self._opInd = v; Object.keys(self._ov).forEach(function (k) { self._ov[k].setOpacity(v); }); } };
      this._lInd = {
        acc: MU.linha(box, {
          label: 'Verde p&uacute;blico a 500 m, por habitante', checked: false,
          color: 'linear-gradient(90deg,' + CAT.crit + ' 0 33%,' + CAT.insuf + ' 33% 66%,' + CAT.adeq + ' 66%)',
          leg: [[CAT.crit, '0 a 3 m&sup2;, d&eacute;fice cr&iacute;tico'], [CAT.insuf, '3 a 9 m&sup2;, insuficiente'],
                [CAT.adeq, 'mais de 9 m&sup2;, adequado (OMS: &ge; 9 m&sup2;/hab)'], [CAT.baixa, 'baixa densidade']],
          onToggle: function (on) { self._setInd(on ? 'acc' : null); }, opacidade: opInd
        }),
        prox: MU.linha(box, {
          label: 'Parque a 300 m ou menos', checked: false,
          color: 'linear-gradient(90deg,' + CAT.adeq + ' 0 50%,' + CAT.crit + ' 50%)',
          leg: [[CAT.adeq, 'a 300 m ou menos de um parque &ge; 0,4 ha'], [CAT.crit, 'a mais de 300 m'], [CAT.baixa, 'baixa densidade']],
          onToggle: function (on) { self._setInd(on ? 'prox' : null); }, opacidade: opInd
        })
      };

      painel.querySelector('#ac-vista').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (b) self.setVista(b.dataset.v, true);
      });
      map.on('zoomend', function () { if (MU.tema === 'acessibilidade') self._rotulos(); });
    },

    /* ---------- estado ---------- */
    _toggle: function (layer, on) {
      if (MU.tema !== 'acessibilidade') return;
      on ? layer.addTo(MU.map) : MU.map.removeLayer(layer);
      this._rotulos();
    },

    _setInd: function (ind) {
      this.ind = ind;
      var self = this;
      ['acc', 'prox'].forEach(function (k) {
        var l = self._lInd[k], on = k === ind;
        if (l.cb.checked !== on) { l.cb.checked = on; l.row.classList.toggle('off', !on); }
      });
      this._render();
    },

    _rotulos: function () {
      var z = MU.map.getZoom(), nomes = this._nomesCand;
      document.querySelectorAll('.cand-label').forEach(function (l) { l.style.display = (nomes && z >= 14) ? '' : 'none'; });
    },

    _overlay: function () {
      if (!this.ind) return null;
      var D = MU.DADOS.acessibilidade.imgs, k = this.vista + '_' + this.ind;
      var src = { actual_acc: D.acc, propostas_acc: D.acc_sim, actual_prox: D.prox, propostas_prox: D.prox_sim }[k];
      if (!this._ov[k]) this._ov[k] = L.imageOverlay(src, MU.BOUNDS, { opacity: this._opInd, pane: 'accPane' });
      this._ov[k].setOpacity(this._opInd);
      return this._ov[k];
    },

    _lowPop: function () {
      if (!this._ovLow) this._ovLow = L.imageOverlay(MU.DADOS.acessibilidade.imgs.baixa, MU.BOUNDS, { pane: 'lowPopPane' });
      return this._ovLow;
    },

    _render: function () {
      var map = MU.map, self = this, S = MU.DADOS.contexto.stats, pr = this.vista === 'propostas', N = this._num[this.vista];
      Object.keys(this._ov).forEach(function (k) { map.removeLayer(self._ov[k]); });
      map.removeLayer(this._lowPop());
      if (MU.tema === 'acessibilidade') {
        var ov = this._overlay();
        if (ov) { ov.addTo(map); this._lowPop().addTo(map); }
      }
      document.querySelectorAll('#ac-vista button').forEach(function (b) {
        var on = b.dataset.v === self.vista;
        b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
      });
      document.getElementById('ac-nums').innerHTML = MU.htmlNums([
        { v: MU.n(S.m2hab, 1), u: 'm&sup2;', r: 'de parque por habitante' },
        { v: MU.n(N.prox), u: '%', r: 'a &le; 300 m de um parque (&ge; 0,4 ha)' + (pr ? ', com propostas' : '') },
        { v: MU.n(N.acc, 1), u: '%', r: 'com &ge; 9 m&sup2; de verde a 500 m' + (pr ? ', com propostas' : '') }
      ]);
      document.getElementById('ac-intro').style.display = pr ? 'block' : 'none';
      this._lCand.row.style.display = pr ? '' : 'none';
      this._lNomes.row.style.display = pr ? '' : 'none';
    },

    /* alterna entre situação actual e propostas; o indicador mantém-se */
    setVista: function (v, deUtilizador) {
      if (v === this.vista && !deUtilizador) return;
      this.vista = v;
      var c = this._lCand.cb;
      if (c.checked !== (v === 'propostas')) { c.checked = (v === 'propostas'); c.dispatchEvent(new Event('change')); }
      MU.setHash({ tema: 'acessibilidade', vista: v });
      this._render();
    },

    /* primeira entrada: vista pedida no URL; «propostas» abre como a página original (proximidade, parques desligados) */
    _inicial: function () {
      var v = MU.param('vista') === 'propostas' ? 'propostas' : 'actual';
      this.vista = v;
      var p = this._lParques.cb, c = this._lCand.cb;
      p.checked = (v === 'actual'); p.closest('.cam').classList.toggle('off', !p.checked);
      c.checked = (v === 'propostas'); c.closest('.cam').classList.toggle('off', !c.checked);
      if (v === 'propostas') this._setInd('prox');
    },

    aoHash: function () {   // #tema=acessibilidade&vista=… alterado à mão com o tema já aberto
      var v = MU.param('vista') === 'propostas' ? 'propostas' : 'actual';
      if (v !== this.vista) this.setVista(v, false);
    },

    activar: function () {
      var map = MU.map;
      if (!this._iniciado) { this._iniciado = true; this._inicial(); }
      this._render();
      MU.activarParques(this);
      if (this._lCand.cb.checked) this._cand.addTo(map);
      this._mono.forEach(function (m) { if (m.linha.cb.checked) m.ov.addTo(map); });
      MU.setHash({ tema: 'acessibilidade', vista: this.vista });
      this._rotulos();
    },

    desactivar: function () {
      var map = MU.map, self = this;
      Object.keys(this._ov).forEach(function (k) { map.removeLayer(self._ov[k]); });
      map.removeLayer(this._lowPop());
      MU.desactivarParques(this);
      map.removeLayer(this._cand);
      this._mono.forEach(function (m) { map.removeLayer(m.ov); });
    }
  });
})();

/* Tema «Regra 3-30-300»: edifícios que cumprem cada indicador. Máscaras de 3 m geradas por regra_303030/mapa_png.py;
   cores da paleta «Carta» (adequado/défice como no tema de acessibilidade). */
MU.registarTema({
  id: 'regra',
  rotulo: 'Regra 3-30-300',
  fundo: 'carta',
  dados: 'regra',
  ctx: { limites: { on: true }, densidade: { on: false } },
  fonte: 'Edif&iacute;cios e rede pedonal: &copy; contribuidores do OpenStreetMap (ODbL) &middot; copa: LiDAR da DGT, MDS/MDT de 50 cm (CC BY 4.0) &middot; ' +
         '&aacute;rvores: invent&aacute;rio da C&acirc;mara do Porto &middot; popula&ccedil;&atilde;o: GHS-POP 2020 (JRC), calibrada ao Censos 2021 (INE).',

  async montar(painel) {
    var N = MU.DADOS.regra.numeros;
    function p(x) { return MU.n(x, 1) + ' %'; }
    var camadas = [
      { id: 'todos', label: 'Cumprem os tr&ecirc;s', color: '#3E6AB3', op: 0.95, ha: N.todos.ha, z: 470 },
      { id: 'nenhum', label: 'N&atilde;o cumprem nenhum', color: '#A23B86', op: 0.95, ha: N.nenhum.ha, z: 460 },
      { id: 'c3', label: 'Cumprem o &laquo;3&raquo; (&aacute;rvores)', color: '#4F9A62', show: false, op: 0.95, ha: N.c3.ha, z: 450 },
      { id: 'c30', label: 'Cumprem o &laquo;30&raquo; (copa)', color: '#1FA6A0', show: false, op: 0.95, ha: N.c30.ha, z: 440 },
      { id: 'c300', label: 'Cumprem o &laquo;300&raquo; (parque)', color: '#E0B000', show: false, op: 0.95, ha: N.c300.ha, z: 430 }
    ];
    var esc = MU.escala(camadas.map(function (c) { return c.ha; }));
    painel.innerHTML =
      '<p class="desc"><b>3</b> &aacute;rvores &agrave; vista, <b>30&nbsp;%</b> de copa a 500&nbsp;m, um parque a <b>300&nbsp;m</b> a p&eacute;: edif&iacute;cio a edif&iacute;cio.</p>' +
      '<div class="nums">' + MU.htmlNums([
        { v: MU.n(N.todos.residentes_pct, 1), u: '%', r: 'dos residentes cumprem os tr&ecirc;s' },
        { v: MU.n(N.c30.residentes_pct, 1), u: '%', r: 'cumprem o &laquo;30&raquo;' },
        { v: MU.n(N.nenhum.residentes_pct, 1), u: '%', r: 'n&atilde;o cumprem nenhum' }
      ]) + '</div>' +
      MU.cab2('Camadas', 'barras: 0&ndash;' + MU.n(esc) + ' ha de edificado') + '<div class="camadas"></div>' +
      '<details class="nota-lim"><summary>Como se mediu e o que n&atilde;o garante</summary>' +
      '<p class="tema-sub">Regra de Cecil Konijnendijk. Residentes que cumprem cada indicador: &laquo;3&raquo; ' + p(N.c3.residentes_pct) + ', &laquo;30&raquo; ' + p(N.c30.residentes_pct) + ', &laquo;300&raquo; ' + p(N.c300.residentes_pct) + '; os tr&ecirc;s: ' + p(N.todos.edificios_pct) + ' dos edif&iacute;cios.</p>' +
      '<p class="tema-sub">&laquo;3&raquo;: &aacute;rvores com copa &ge; 25&nbsp;m&sup2; e &ge; 3&nbsp;m (LiDAR) mais o invent&aacute;rio da C&acirc;mara, vistas a &le; 30&nbsp;m de janelas simuladas a cada 5&nbsp;m, em linha de vista 2D (ignora a altura dos obst&aacute;culos). O &laquo;3&raquo; n&atilde;o tem base cient&iacute;fica pr&oacute;pria.</p>' +
      '<p class="tema-sub">&laquo;30&raquo;: o resultado depende muito do limiar: a 25&nbsp;% passa de ' + MU.n(N.c30.edificios_pct, 1) + '&nbsp;% para ' + MU.n(N.sens.c30_limiar25_pct, 1) + '&nbsp;% dos edif&iacute;cios. O LiDAR &eacute; de inverno (2024&ndash;26): copas de folha caduca podem estar subestimadas. Duas folhas com alturas n&atilde;o fi&aacute;veis ficam de fora.</p>' +
      '<p class="tema-sub">&laquo;300&raquo;: a p&eacute; pela rede do OpenStreetMap, parques &ge; 0,5&nbsp;ha (com &ge; 1&nbsp;ha: ' + MU.n(N.sens.c300_1ha_pct, 1) + '&nbsp;% dos edif&iacute;cios). Serralves e outros espa&ccedil;os vedados contam como parque.</p>' +
      '<p class="tema-sub">Residentes: GHS-POP 2020 repartido pelos edif&iacute;cios por &aacute;rea &times; altura e calibrado ao Censos 2021 (modelo, n&atilde;o contagem).</p>' +
      '<p class="tema-sub">Valida&ccedil;&atilde;o: 150 edif&iacute;cios (amostra estratificada) comparados com a leitura da ortofoto DGT 2025 de 25&nbsp;cm feita por IA, n&atilde;o no terreno. Concord&acirc;ncia: &laquo;30&raquo; 89&nbsp;% (copa do modelo +2,9 pontos percentuais acima da ortofoto), &laquo;300&raquo; 75&nbsp;% (as diferen&ccedil;as v&ecirc;m de parques a 309&ndash;650&nbsp;m a p&eacute;, mas &le; 300&nbsp;m em linha recta), &laquo;3&raquo; 71&nbsp;%: o modelo &eacute; conservador, metade das diferen&ccedil;as vem de edif&iacute;cios a tapar a vista, que a ortofoto n&atilde;o v&ecirc;.</p></details>';
    var box = painel.querySelector('.camadas');
    MU.linhaParques(this, box, { on: false, contorno: true, label: 'Parques e jardins (contorno)', ha: false });
    await MU.addCamadas(this, box, camadas, esc);
  },

  activar() { MU.activarCamadas(this); MU.activarParques(this); },
  desactivar() { MU.desactivarCamadas(this); MU.desactivarParques(this); }
});

/* Tema «Mudanças 2016–2025» (antes mapa/mapa.html): transições 2016-17 → 2024-25 e uso do solo 2024-25
   (Sentinel-2, 10 m). Cores da maquete «Carta» V2b; as máscaras são tingidas no browser. */
MU.registarTema({
  id: 'hoje',
  rotulo: 'Mudanças 2016–2025',

/* Tema «Histórico»: escada das épocas 2023-24 → 1947 (uma de cada vez, cada uma com a sua cor), números-chave,
   edificado opcional, perda e ganho de vegetação, cortina para comparar duas épocas e, para 1979, o detalhe
   das 5 classes de Filipa Guilherme. (sem NDVI — a página ndvi_historico/ continua à parte). */
(function () {
  /* id, rótulo, fonte/resolução, fonte diferente das restantes (ressalva), cor da época (maquete V2b) */
  var CALIB = 'fra&ccedil;&atilde;o de vegeta&ccedil;&atilde;o por p&iacute;xel (NDVI calibrado com o Sentinel-2 do tema &laquo;Hoje&raquo;)';
  var L30 = 'Landsat 5 TM, 30 m; ' + CALIB;
  var L8 = 'Landsat 8/9 OLI, 30 m, ajustado ao TM por uma recta de NDVI medida em Landsat 7 (áreas estáveis); cenas avariadas excluídas; ' + CALIB;
  var EPOCAS = [
    { id: '2023-24', nome: '2023-2024', curto: '2023–24', cor: '#2E8B4E', fonte: L8 },
    { id: '2016-17', nome: '2016-2017', curto: '2016–17', cor: '#7A55B8', fonte: L8 },
    { id: '2001-05', nome: '2001-2005', curto: '2001–05', cor: '#C08A12', fonte: L30 },
    { id: '1995-00', nome: '1995-2000', curto: '1995–2000', cor: '#10A38A', fonte: L30 },
    { id: '1985-90', nome: '1985-1990', curto: '1985–90', cor: '#3E6AB3', fonte: L30 },
    { id: '1979', nome: '1979', curto: '1979', cor: '#B03A7A', dif: true,
      fonte: 'Ocupa&ccedil;&atilde;o do solo 1979 (Filipa Guilherme), vectorial; vegeta&ccedil;&atilde;o = &aacute;rvores, arbustos e herb&aacute;ceas, edificado = elementos artificiais' },
    { id: '1947', nome: '1947', curto: '1947', cor: '#8C5A2B', dif: true,
      fonte: 'Ortofotomapa 1947 (CIIMAR/FCUP); Pixel RF (textura local), limpo com Sentinel-2 e Landsat 1985' }
  ];
  var RESSALVA = 'Fonte diferente das outras &eacute;pocas: n&atilde;o compar&aacute;vel em rigor.';
  var BOUNDS_1947 = [[41.12912995365261, -8.700884213830351], [41.189999037480554, -8.539187462666328]];
  var COR = { edif: '#C4A882', perda: '#6A3FB5', ganho: '#E0B000' };  /* todas as máscaras são tingidas por filtro SVG */
  var CLASSES_1979 = [
    ['ABE', 'Elementos artificiais (constru&iacute;do)', '#C4A882'],
    ['TRS', '&Aacute;rvores e arbustos', '#357A47'],
    ['HER', 'Herb&aacute;ceas', '#8DBF7E'],
    ['SPV', 'Vegeta&ccedil;&atilde;o esparsa (terrestre)', '#D9CBA0'],
    ['AQU', 'Vegeta&ccedil;&atilde;o esparsa (aqu&aacute;tica)', '#86BCD6']
  ];

  /* fundo «Ortofoto 1947» (WMS do CIIMAR/FCUP); só faz sentido neste tema */
  MU.FUNDOS.push({
    id: 'orto1947', nome: 'Ortofoto 1947', so: 'historico',
    criar: function () {
      return L.tileLayer.wms('https://gis.ciimar.up.pt/porto/wms', {

        version: '1.1.1', maxZoom: 20, attribution: 'CIIMAR/FCUP'
      });

  });

  var pc = function (x) { return MU.n(x, 1) + ' %'; };
  var ha = function (x) { return MU.n(x) + ' ha'; };
  var por = function (id) { return EPOCAS.filter(function (e) { return e.id === id; })[0]; };

  MU.registarTema({
    id: 'historico',
    rotulo: 'Histórico 1947–2024',
  artigo: { url: 'https://portoverde.pt/posts/mudanca-verde-porto-1947-2025/' },
    fundo: 'carta',
    dados: 'historico',
    ctx: { limites: { on: true }, densidade: { on: false } },
    fonte: 'Ortofotomapa 1947 (CIIMAR/FCUP) &middot; Landsat TM/ETM+/OLI (USGS/NASA), NDVI calibrado em fra&ccedil;&atilde;o de vegeta&ccedil;&atilde;o com o Sentinel-2 (tema &laquo;Hoje&raquo;) &middot; ' +
           '1947: Pixel RF (textura local), limpo com Sentinel-2 e Landsat 1985 &middot; ' +
           'ocupa&ccedil;&atilde;o do solo 1979: <a href="https://www.cibio.up.pt/en/people/details/filipa-isabel-jesus-guilherme/" target="_blank" rel="noopener">Filipa Guilherme</a> &middot; ' +
           'limites: CAOP 2025 (DGT). Hectares por contagem de p&iacute;xeis (&asymp; 57 m&sup2; cada) dentro do concelho.',

    async montar(painel) {
      var D = MU.DADOS.historico, S = MU.DADOS.contexto.stats, map = MU.map, self = this;
      var est = { epoca: null, edif: false, perdaGanho: false, det79: false, comparar: false, esq: '2023-24', dir: '1947' };
      var activo = false, visiveis = [], cache = {}, opac = 0.9, mud = null, det = null, pos = 0.5;
      var PANES = { masc: 'hMascPane', o47: 'h1947Pane' };
      var PANES_ESQ = { masc: 'hEsqPane', o47: 'hEsqPane' }, PANES_DIR = { masc: 'hDirPane', o47: 'hDirPane' };
      [['h1947Pane', 405], ['hCobPane', 408], ['hMascPane', 415], ['hEsqPane', 416], ['hDirPane', 417], ['hMudPane', 420]]
        .forEach(function (p) { map.createPane(p[0]); map.getPane(p[0]).style.zIndex = p[1]; });

      /* ---- painel ---- */
      var num = D.numeros;
      var escada = EPOCAS.map(function (e) {
        var n = num[e.id];
        var tip = e.nome + ': vegetação ' + pc(n.veg) + ', edificado ' + pc(n.edif) +

        return '<button type="button" role="radio" data-epoca="' + e.id + '" style="--ep:' + e.cor + '" title="' + tip + '">' +
          '<span>' + e.curto + (e.dif ? '<small>outra fonte</small>' : '') + '</span>' +

      }).join('');
      var opcoes = EPOCAS.map(function (e) { return '<option value="' + e.id + '">' + e.nome + '</option>'; }).join('');
      var cobBaixa = EPOCAS.filter(function (e) { return num[e.id].cobertura < 100; }).map(function (e) {
        return e.nome + ': cobertura ' + pc(num[e.id].cobertura) + ' do concelho';
      });
      painel.innerHTML =
        '<p class="desc">Vegeta&ccedil;&atilde;o do concelho em sete &eacute;pocas. 1947 e 1979 v&ecirc;m de outras fontes: compara&ccedil;&atilde;o indicativa.</p>' +
        '<div class="nums" id="h-nums"></div>' +
        '<div id="h-escada">' + MU.cab2('&Eacute;poca &middot; vegeta&ccedil;&atilde;o no concelho', '0&ndash;100 %') +
        '<div class="escada" id="h-tempo" role="radiogroup" aria-label="&Eacute;poca">' + escada + '</div></div>' +
        '<div class="h-comp" id="h-comp" style="display:none">' + MU.cab2('Comparar duas &eacute;pocas', 'arrasta a barra no mapa') +
          '<label>Esquerda <select id="h-esq">' + opcoes + '</select></label>' +
          '<label>Direita <select id="h-dir">' + opcoes + '</select></label></div>' +
        '<p class="h-fonte" id="h-fonte"></p>' +
        MU.cab2('Camadas', '') + '<div id="h-parq"></div><div id="h-mud"></div><div id="h-cams"></div>' +
        '<div class="leg" id="h-leg"></div>' +
        '<button type="button" id="h-cmp" class="btn">Comparar duas &eacute;pocas</button>' +
        '<button type="button" id="h-79" class="btn" style="display:none">Ver as 5 classes de 1979</button>' +
        '<p class="fonte" style="margin-top:12px">* outra fonte: n&atilde;o compar&aacute;vel em rigor. O resto (solo nu, &aacute;gua, sombras) n&atilde;o est&aacute; contado.' +
          (cobBaixa.length ? '<br>' + cobBaixa.join('<br>') : '') + '</p>';

      /* filtro SVG que tinge as máscaras (alfa) com a cor de cada época; sem canvas de 170 Mpx */
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '0'); svg.setAttribute('height', '0'); svg.style.position = 'absolute';
      var matriz = function (hex) {
        var c = MU.hexToRgb(hex).map(function (v) { return (v / 255).toFixed(4); });
        return '0 0 0 0 ' + c[0] + '  0 0 0 0 ' + c[1] + '  0 0 0 0 ' + c[2] + '  0 0 0 1 0';
      };
      var tons = [['edif', COR.edif], ['perda', COR.perda], ['ganho', COR.ganho]]
        .concat(EPOCAS.map(function (e) { return ['ep' + e.id, e.cor]; }));
      svg.innerHTML = tons.map(function (k) {
        return '<filter id="h-tint-' + k[0] + '" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="' +
               matriz(k[1]) + '"/></filter>';
      }).join('');
      painel.appendChild(svg);

      /* ---- camadas de cada época (criadas à primeira utilização) ---- */
      var imagem = function (url, bounds, pane, tom) {
        var ov = L.imageOverlay(url, bounds, { pane: pane, opacity: opac });
        ov.on('add', function () { ov.getElement().style.filter = 'url(#h-tint-' + tom + ')'; });
        return ov;
      };
      function camadas(id, panes) {   // [vegetação, edificado]
        var k = id + '|' + panes.masc;
        if (cache[k]) return cache[k];
        var ls;
        if (id === '1947') {
          ls = [['uso_1947_vegetacao', 'ep1947'], ['uso_1947_edificado', 'edif']].map(function (d) {
            return imagem(D[d[0]], BOUNDS_1947, panes.o47, d[1]);
          });
        } else {
          ls = [['veg', 'ep' + id], ['edif', 'edif']].map(function (p) { return imagem(D[p[0] + '_' + id], MU.BOUNDS, panes.masc, p[1]); });
        }
        return (cache[k] = ls);
      }
      var daEpoca = function (id, panes) { var c = camadas(id, panes); return est.edif ? c : [c[0]]; };
      function perdaGanho() {
        return mud || (mud = [['veg_perda', 'perda'], ['veg_ganho', 'ganho']].map(function (d) {
          return imagem(D[d[0]], MU.BOUNDS, 'hMudPane', d[1]);
        }));
      }
      function detalhe79() {
        return det || (det = CLASSES_1979.map(function (c) {
          return L.geoJson(D.cobertura_1979, {
            pane: 'hCobPane',
            filter: function (f) { return f.properties.c === c[0]; },
            style: function () { return { stroke: false, fillColor: c[2], fillOpacity: 0.75 }; },
            onEachFeature: function (f, layer) {
              layer.bindPopup('<b style="font-size:13px;">' + c[1] + '</b><br><span style="color:#4B6270;">1979 &mdash; ' +
                f.properties.ha.toLocaleString('pt-PT') + ' ha</span>');
            }
          });
        }));
      }

      /* ---- cortina: dois conjuntos de overlays, cada um num pane recortado ---- */
      var sep = document.createElement('div');
      sep.id = 'h-cortina'; sep.style.display = 'none';
      sep.innerHTML = '<span class="h-etq h-etq-e"></span><span class="h-linha"></span>' +
                      '<span class="h-asa" tabindex="0" role="slider" aria-label="Posição da comparação" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" title="Arrasta ou usa as setas">&#8596;</span><span class="h-etq h-etq-d"></span>';
      map.getContainer().appendChild(sep);
      L.DomEvent.disableClickPropagation(sep);
      function recorte() {
        if (!activo || !est.comparar) return;
        var tam = map.getSize(), x = pos * tam.x;
        var nw = map.containerPointToLayerPoint([0, 0]), se = map.containerPointToLayerPoint(tam), cx = nw.x + x;
        map.getPane('hEsqPane').style.clip = 'rect(' + nw.y + 'px,' + cx + 'px,' + se.y + 'px,' + nw.x + 'px)';
        map.getPane('hDirPane').style.clip = 'rect(' + nw.y + 'px,' + se.x + 'px,' + se.y + 'px,' + cx + 'px)';
        sep.style.left = x + 'px';
      }
      map.on('move zoom resize', recorte);
      function cortina(p) {
        pos = Math.max(0.02, Math.min(0.98, p)); recorte();
        sep.querySelector('.h-asa').setAttribute('aria-valuenow', Math.round(pos * 100));
      }
      sep.addEventListener('keydown', function (ev) {
        var d = ev.key === 'ArrowLeft' ? -0.05 : ev.key === 'ArrowRight' ? 0.05 : 0;
        if (d) { cortina(pos + d); ev.preventDefault(); ev.stopPropagation(); }
      });
      var arrasto = false;
      sep.addEventListener('pointerdown', function (ev) {
        if (!ev.target.closest('.h-asa, .h-linha')) return;
        arrasto = true;
        try { ev.target.setPointerCapture(ev.pointerId); } catch (x) { /* sem captura */ }
        ev.preventDefault(); ev.stopPropagation();
      });
      sep.addEventListener('pointermove', function (ev) {
        if (!arrasto) return;
        var r = map.getContainer().getBoundingClientRect();
        cortina((ev.clientX - r.left) / r.width);
      });
      var fimArrasto = function () { arrasto = false; };
      sep.addEventListener('pointerup', fimArrasto);
      sep.addEventListener('pointercancel', fimArrasto);

      /* ---- linhas de camadas ---- */
      var q = function (s) { return painel.querySelector(s) || document.querySelector(s); };   // #h-nums vive no cartão do mapa
      var boxEdif = MU.linha(q('#h-cams'), {
        label: 'Edificado na &eacute;poca escolhida', checked: false, color: COR.edif,
        onToggle: function (on) { est.edif = on; mostrar(); }
      });
      var boxVeg = MU.linha(q('#h-cams'), {
        label: 'Vegeta&ccedil;&atilde;o na &eacute;poca escolhida', checked: true, color: EPOCAS[0].cor,
        onToggle: function (on) { est.veg = on; mostrar(); },
        opacidade: { v: 90, min: 10, max: 100, step: 5, id: 'h-op', onInput: function (v) {
          opac = v / 100;
          Object.keys(cache).forEach(function (k) { cache[k].forEach(function (o) { o.setOpacity(opac); }); });
          if (mud) mud.forEach(function (o) { o.setOpacity(opac); });
        } }
      });
      est.veg = true;
      var boxMud = MU.linha(q('#h-mud'), {
        label: 'Perda e ganho 1985-90 &rarr; 2023-24', checked: false,
        color: 'linear-gradient(90deg,' + COR.perda + ' 0 50%,' + COR.ganho + ' 50%)',
        leg: [[COR.perda, 'Perda de vegeta&ccedil;&atilde;o &middot; <span class="n">' + ha(S.perda) + '</span>'],
              [COR.ganho, 'Ganho de vegeta&ccedil;&atilde;o &middot; <span class="n">' + ha(S.ganho) + '</span>']],
        onToggle: function (on) { est.perdaGanho = on; mostrar(); }
      });
      MU.linhaParques(this, q('#h-parq'), { on: false, contorno: true, label: 'Parques e jardins actuais (contorno)', ha: false });

      /* ---- estado → mapa e painel ---- */
      var leg = function (cor, txt) { return '<div><i style="background:' + cor + '"></i><span>' + txt + '</span></div>'; };
      var difPP = function (a, b) { var d = num[a].veg - num[b].veg; return MU.n(Math.abs(d), 1); };
      /* saldo com sinal (b − a): «+1,4» = mais vegetação em b; «−2,0» = menos */
      var saldoPP = function (a, b) { var d = num[b].veg - num[a].veg; return (d > 0 ? '+' : d < 0 ? '−' : '') + MU.n(Math.abs(d), 1); };
      /* 1σ (p.p.) da % de vegetação por época Landsat (dispersão ano a ano + ponte L8-L7); 1947/1979 não têm */
      var INC = D.incerteza || {};
      var sigma = function (a, b) { return (INC[a] != null && INC[b] != null) ? Math.sqrt(INC[a] * INC[a] + INC[b] * INC[b]) : null; };
      var pm = function (s) { return s == null ? '' : ' (&plusmn;' + MU.n(s, 1) + ')'; };
      /* diferença maior que 2σ → distinta do ruído; senão, não afirmar tendência */
      var distinta = function (a, b) { var s = sigma(a, b); return s != null && Math.abs(num[b].veg - num[a].veg) > 2 * s; };
      function mostrar() {
        visiveis.forEach(function (l) { map.removeLayer(l); });
        visiveis = [];
        sep.style.display = (activo && est.comparar) ? 'block' : 'none';
        if (!activo) return;
        var ls = est.comparar ? daEpoca(est.esq, PANES_ESQ).concat(daEpoca(est.dir, PANES_DIR))
               : est.perdaGanho ? perdaGanho()
               : (est.epoca === '1979' && est.det79) ? detalhe79() : daEpoca(est.epoca, PANES);
        if (!est.comparar && !est.perdaGanho && !est.det79 && !est.veg) ls = ls.slice(1);
        ls.forEach(function (l) { l.addTo(map); visiveis.push(l); });
        q('#h-escada').style.display = est.comparar ? 'none' : 'block';
        q('#h-comp').style.display = est.comparar ? 'block' : 'none';
        var bc = q('#h-cmp'); bc.textContent = est.comparar ? 'Sair da comparação' : 'Comparar duas épocas'; bc.classList.toggle('active', est.comparar);
        boxMud.cb.disabled = est.comparar;
        painel.querySelectorAll('#h-tempo [data-epoca]').forEach(function (b) {
          var on = !est.comparar && !est.perdaGanho && b.dataset.epoca === est.epoca;
          b.classList.toggle('active', on); b.setAttribute('aria-checked', on);
        });
        var b79 = q('#h-79');
        if (est.comparar) {
          var a = por(est.esq), d = por(est.dir), na = num[est.esq], nd = num[est.dir];
          q('#h-esq').value = est.esq; q('#h-dir').value = est.dir;
          boxVeg.row.style.setProperty('--sw', 'linear-gradient(90deg,' + a.cor + ' 0 50%,' + d.cor + ' 50%)');
          q('#h-fonte').innerHTML = '<b>Esq. ' + a.nome + '</b>: ' + a.fonte + '<br><b>Dir. ' + d.nome + '</b>: ' + d.fonte +
            ((a.dif || d.dif) ? '<br><i>' + RESSALVA + '</i>' : '');
          q('#h-nums').innerHTML = MU.htmlNums([
            { v: MU.n(na.veg, 1), u: '%', r: 'de vegeta&ccedil;&atilde;o em ' + a.nome + ' (esq.)' },
            { v: MU.n(nd.veg, 1), u: '%', r: 'em ' + d.nome + ' (dir.)' },
            { v: difPP(est.esq, est.dir), u: 'p.p.',
              r: 'de diferen&ccedil;a' + pm(sigma(est.esq, est.dir)) + (sigma(est.esq, est.dir) != null && !distinta(est.esq, est.dir) ? '; dentro do ru&iacute;do' : '') }
          ]);
          b79.style.display = 'none';
          q('#h-leg').innerHTML = leg(a.cor, 'Vegeta&ccedil;&atilde;o, esquerda: ' + a.nome) + leg(d.cor, 'Vegeta&ccedil;&atilde;o, direita: ' + d.nome) +
            (est.edif ? leg(COR.edif, 'Edificado') : '');
